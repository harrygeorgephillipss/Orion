<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>ORION · Home Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ORION — calm theme. Soft slate + sage, generous space, few lines. Status always = words + icon + colour. */
:root,[data-theme=dark]{
  --bg:#0f1517; --s1:#151d20; --s2:#1b2529; --s3:#243034; --line:rgba(255,255,255,.06); --shadow:0 1px 0 rgba(255,255,255,.02),0 10px 30px -18px rgba(0,0,0,.6);
  --text:#e6eeee; --text2:#b2c0c1; --muted:#7f9093;
  --accent:#86d0c3; --on-accent:#0b201c;
  --ok:#7fd4a8; --warn:#e6c27f; --crit:#ef8a8a; --critS:#d65f5f; --degr:#e2a982; --off:#8b989b; --info:#93b8e6;
  --aura:#b8a7f2; --aura2:#e3bdf2; --on-aura:#1c1438;
  --glow:radial-gradient(1200px 500px at 85% -10%,rgba(134,208,195,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(184,167,242,.06),transparent 60%);
  --r:20px;
  --font:'Inter','Noto Sans Malayalam','Noto Sans Devanagari','Noto Sans Tamil',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f2f5f4; --s1:#ffffff; --s2:#eef2f1; --s3:#e2e9e7; --line:rgba(20,40,40,.07); --shadow:0 1px 2px rgba(20,40,40,.04),0 12px 32px -20px rgba(20,40,40,.25);
  --text:#1b2a2b; --text2:#435658; --muted:#6c7f81;
  --accent:#2c8a7b; --on-accent:#ffffff;
  --ok:#2f9466; --warn:#a97a1f; --crit:#c24848; --critS:#c24848; --degr:#b86a3a; --off:#7a888a; --info:#3b6fbd;
  --aura:#7a62d6; --aura2:#b46ad8; --on-aura:#ffffff;
  --glow:radial-gradient(1200px 500px at 85% -10%,rgba(44,138,123,.08),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(122,98,214,.06),transparent 60%);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
body{background-image:var(--glow);background-attachment:fixed;min-height:100vh;transition:background-color .3s}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
main:focus,main:focus-visible{outline:none}
h1{font-size:24px;line-height:1.3;margin:0 0 4px;font-weight:600;letter-spacing:-.015em}
h2{font-size:15px;margin:0;font-weight:600}
h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:600}
.mono{font-family:var(--mono);font-size:.88em}
.hint{color:var(--muted);font-size:13px}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px;z-index:99}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13.5px}
.lnk:hover{text-decoration:underline}

/* demo bar & header */
.demo-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 14px;font-size:12.5px;color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--bg))}
.demo-btn{background:transparent;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);border-radius:999px;padding:2px 11px;cursor:pointer;font-size:12px}
.demo-btn:hover{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;color:var(--accent);font-weight:700;letter-spacing:.24em;font-size:13.5px}.brand span{color:var(--text)}
.tabs{display:flex;gap:2px;flex:1;justify-content:center}
.tabs a,.btabs a{position:relative;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.tabs a:hover{color:var(--text)}
.tabs a.on{background:var(--s1);color:var(--text);box-shadow:var(--shadow)}
.tabs a.is-aura .ic{color:var(--aura)}
.cnt{position:absolute;top:1px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--critS);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-style:normal}
.hd-state{min-width:120px;display:flex;justify-content:flex-end;margin-left:auto}
.hpill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;font-size:13px;font-weight:600}
.hpill .ic{width:16px;height:16px;stroke-width:2.1}
.s-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.s-crit{color:#fff;background:var(--critS)}.s-degr{color:var(--degr);background:color-mix(in srgb,var(--degr) 14%,transparent)}.s-off{color:var(--off);background:var(--s2)}
.s-info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}.s-aura{color:var(--aura);background:color-mix(in srgb,var(--aura) 14%,transparent)}
.hpill.s-crit{animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--critS) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btabs{display:none}

/* page */
main{max-width:1100px;margin:0 auto;padding:22px 28px 90px;transition:margin .25s}
.page-h{margin:6px 0 20px}.page-h p{margin:0;color:var(--text2);max-width:700px}
.card{background:var(--s1);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2{margin-bottom:12px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 4px 12px}
.card .sec-h{margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.two .card{margin:0}
.stack{display:flex;flex-direction:column}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.note{font-size:13px;padding:9px 12px;border-radius:12px;background:var(--s2)}.note.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--s1))}
.tag-demo{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* status */
.status{display:flex;gap:20px;align-items:center;padding:26px 28px;border-radius:24px;background:var(--s1);box-shadow:var(--shadow)}
.st-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.st-ic .ic{width:28px;height:28px;stroke-width:2}
.st-txt{flex:1;min-width:0}.st-txt h1{font-size:26px}.st-txt p{margin:2px 0 0;color:var(--text2)}
.st-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.st-time{font-size:12px;color:var(--muted);white-space:nowrap;align-self:flex-start}
.st-lk,.st-also{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--text2)}.st-lk .ic,.st-also .ic{width:16px;height:16px}
.st-ok .st-ic{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.st-warn{background:linear-gradient(120deg,color-mix(in srgb,var(--warn) 10%,var(--s1)),var(--s1) 60%)}.st-warn .st-ic{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st-crit{background:linear-gradient(120deg,color-mix(in srgb,var(--critS) 18%,var(--s1)),var(--s1) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--critS) 45%,transparent),var(--shadow)}.st-crit .st-ic{background:var(--critS);color:#fff;animation:pulse 2s infinite}.st-crit h1{color:var(--crit)}
.st-degr{background:linear-gradient(120deg,color-mix(in srgb,var(--degr) 9%,var(--s1)),var(--s1) 60%)}.st-degr .st-ic{background:color-mix(in srgb,var(--degr) 15%,transparent);color:var(--degr)}
.st-off{background:repeating-linear-gradient(135deg,var(--s1) 0 14px,var(--s2) 14px 28px)}.st-off .st-ic{background:var(--s2);color:var(--off)}

/* alerts on home */
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.alert{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--s1);box-shadow:var(--shadow)}
.a-crit{background:color-mix(in srgb,var(--critS) 11%,var(--s1))}.a-warn{background:color-mix(in srgb,var(--warn) 9%,var(--s1))}
.a-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex:none}
.a-crit .a-ic{color:var(--crit)}.a-warn .a-ic{color:var(--warn)}.a-degr .a-ic{color:var(--degr)}
.a-txt{flex:1;min-width:0;display:flex;flex-direction:column}.a-txt span{font-size:13px;color:var(--muted)}
.a-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* chips & buttons */
.chip-s{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip-s .d{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.chip-s .ic{width:14px;height:14px;stroke-width:2.1}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 12px;font-size:13px}.btn .ic{width:16px;height:16px}
.btn.ghost{background:var(--s2);color:var(--text)}.btn.ghost:hover{background:var(--s3)}
.btn.danger{background:var(--critS);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--s2);color:var(--text);flex:none;transition:background .15s}
.round.sm{width:34px;height:34px}.round.sm .ic{width:18px;height:18px}.round:hover{background:var(--s3)}
.mini{display:inline-flex;align-items:center;gap:5px;background:transparent;border:0;color:var(--muted);font-size:12.5px;padding:4px 9px;border-radius:9px;cursor:pointer}
.mini .ic{width:15px;height:15px}.mini:hover,.mini.on{color:var(--text);background:var(--s2)}
.seg{display:inline-flex;background:var(--s2);border-radius:13px;padding:3px;gap:2px}
.seg-b{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:6px 13px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13.5px}
.seg-b .ic{width:15px;height:15px}
.seg-b.on{background:var(--s1);color:var(--text);box-shadow:var(--shadow)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted);font-size:13.5px;box-shadow:var(--shadow)}
.pill .ic{width:16px;height:16px}.pill.on{background:var(--accent);color:var(--on-accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:var(--s1);min-width:0;box-shadow:var(--shadow);transition:transform .15s,background .15s}
.tile:hover{transform:translateY(-2px)}.tile:focus-visible{outline:2px solid var(--accent)}
.t-top{display:flex;gap:10px;align-items:center}
.t-ic{width:34px;height:34px;padding:7px;border-radius:11px;background:var(--s2);color:var(--text2)}
.t-name{display:flex;flex-direction:column;font-weight:600;font-size:14px;line-height:1.25;min-width:0}.t-name span{font-weight:400;color:var(--muted);font-size:12px}
.t-val{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-top:12px}
.t-val b{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}.t-val i{font-style:normal;color:var(--muted);font-size:15px}
.t-lk{width:100%;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--off)}
.t-small{font-size:12.5px;color:var(--muted)}
.t-spark{margin:6px 0 4px;opacity:.85}
.t-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:auto}.t-foot .ic{width:14px;height:14px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.lv-warn .t-val b{color:var(--warn)}.lv-crit .t-val b{color:var(--crit)}.lv-muted .t-val b{color:var(--off);font-size:20px}
.tile.lv-warn{background:color-mix(in srgb,var(--warn) 8%,var(--s1))}.tile.lv-warn .t-ic{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tile.lv-crit{background:color-mix(in srgb,var(--critS) 12%,var(--s1));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--critS) 45%,transparent)}.tile.lv-crit .t-ic{color:#fff;background:var(--critS)}
.tile.is-stale{background:repeating-linear-gradient(135deg,var(--s1) 0 10px,var(--s2) 10px 20px)}
.tile.is-stale .t-val b{color:var(--off);text-decoration:line-through;text-decoration-thickness:1px}
.tile.is-stale .t-foot{color:var(--degr)}
.spark{width:100%;height:32px}.spark-empty{height:32px;font-size:11px;color:var(--muted);display:grid;place-items:center}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 0}
.rows li+li{border-top:1px solid var(--line)}
.rows li>.ic{color:var(--muted)}
.rows li>span:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}
.rows small{color:var(--muted);font-size:12px}
.r-v{display:flex;align-items:center;gap:8px}.r-v small{font-size:12px}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:13px 0}
.drow+.drow{border-top:1px solid var(--line)}
.d-ic{width:38px;height:38px;padding:9px;border-radius:12px;background:var(--s2);color:var(--text2)}
.d-txt{display:flex;flex-direction:column;min-width:0}.d-txt span{font-size:13px;color:var(--muted)}
.d-ctrl{grid-column:2/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* aura entry + fab */
.aura-card{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:16px;margin-top:16px;padding:20px 22px;border-radius:var(--r);background:linear-gradient(110deg,color-mix(in srgb,var(--aura) 14%,var(--s1)),var(--s1) 70%);box-shadow:var(--shadow);transition:transform .15s}
.aura-card:hover{transform:translateY(-2px)}.aura-card:focus-visible{outline:2px solid var(--aura)}
.ac-t{flex:1;display:flex;flex-direction:column}.ac-t span{color:var(--text2);font-size:13.5px}
.ac-mic{width:42px;height:42px;padding:10px;border-radius:50%;background:var(--aura);color:var(--on-aura)}
.orb{width:34px;height:34px;border-radius:50%;flex:none;display:inline-block;background:radial-gradient(circle at 35% 30%,#fff 0,var(--aura2) 20%,var(--aura) 50%,color-mix(in srgb,var(--aura) 55%,#000) 90%);box-shadow:0 0 24px -4px color-mix(in srgb,var(--aura) 70%,transparent)}
.orb.lg{width:38px;height:38px}.orb.xl{width:64px;height:64px;animation:breathe 5s ease-in-out infinite}.orb.sm{width:16px;height:16px;box-shadow:none}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 40px -2px color-mix(in srgb,var(--aura) 70%,transparent)}}
.aura-fab{position:fixed;right:24px;bottom:24px;z-index:35;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border:0;border-radius:999px;cursor:pointer;background:var(--s1);color:var(--text);font-weight:600;box-shadow:0 12px 34px -12px rgba(0,0,0,.55),0 0 0 1px var(--line)}
.aura-fab:hover{transform:translateY(-2px)}.aura-fab .orb{width:32px;height:32px}
.aura-open .aura-fab{display:none}

/* aura side panel */
.apanel{position:fixed;top:0;right:0;bottom:0;width:420px;z-index:38;background:var(--s1);box-shadow:-20px 0 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:16px 18px 14px}
.ap-x{position:absolute;top:16px;right:16px;z-index:2}
.ap-body{flex:1;min-height:0;display:flex}
.ap-body>.aura{flex:1}
@media (min-width:1280px){body.aura-open main{margin-right:430px}}

/* history */
.sum{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:8px}
.sum div{display:flex;flex-direction:column}.sum b{font-size:22px;font-weight:600}.sum span{font-size:12.5px;color:var(--muted)}
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .grid.v{stroke-dasharray:2 6}
.chart .axis{fill:var(--muted);font:11px var(--font)}.chart .axis.unit{fill:var(--text2);font-weight:600}
.chart .thr{stroke-dasharray:6 6;stroke-width:1.1;opacity:.8}.chart .thr-warn{stroke:var(--warn);fill:var(--warn)}.chart .thr-crit{stroke:var(--crit);fill:var(--crit)}
.chart .thrt{font:11px var(--font);stroke:none}
.chart .mk{opacity:.12}.chart .mk-crit{fill:var(--crit);stroke:var(--crit)}.chart .mk-warn{fill:var(--warn);stroke:var(--warn)}.chart .mk-degr{fill:var(--degr);stroke:var(--degr)}.chart .mk-info{fill:var(--info)}
.chart .mkl{opacity:.6;stroke-width:1.1}
.chart .mkt{font:600 9.5px var(--font);letter-spacing:.05em}.chart .mkt-crit{fill:var(--crit)}.chart .mkt-warn{fill:var(--warn)}.chart .mkt-degr{fill:var(--degr)}
.chart .gap{fill:color-mix(in srgb,var(--off) 8%,transparent);stroke:color-mix(in srgb,var(--off) 35%,transparent);stroke-dasharray:3 3}
.chart .gapt{fill:var(--muted);font:10px var(--font)}
.chart .xh{stroke:var(--text2);stroke-dasharray:3 3}
.ctip{position:absolute;top:6px;background:var(--s1);border-radius:12px;padding:8px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:1px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px var(--line);white-space:nowrap}
.ctip .muted{color:var(--muted)}
.chart-empty{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);border-radius:14px;background:var(--s2);font-size:13.5px}
.csv{width:100%;font:11.5px var(--mono);background:var(--s2);color:var(--text2);border:0;border-radius:12px;padding:10px}

/* alerts page */
.al-list{display:flex;flex-direction:column;gap:8px}
details.al{border-radius:18px;background:var(--s1);box-shadow:var(--shadow)}
details.al>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
details.al>summary::-webkit-details-marker{display:none}
details.al .chev{color:var(--muted);transition:transform .15s}details.al[open] .chev{transform:rotate(90deg)}
details.al.done .a-ic{color:var(--muted)}
details.al.a-crit:not(.done){background:color-mix(in srgb,var(--critS) 10%,var(--s1))}details.al.a-warn:not(.done){background:color-mix(in srgb,var(--warn) 8%,var(--s1))}
.al-body{padding:0 18px 18px 70px}

<script>
/* ORION core: namespace, utilities, configuration defaults, formatting. */
'use strict';
const ORION = (window.ORION = window.ORION || {});

/* ---------- utilities ---------- */
ORION.util = (function () {
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let idc = 0;
  const uid = (p) => `${p}-${Date.now().toString(36)}-${(++idc).toString(36)}`;
  const iso = (ms) => new Date(ms).toISOString();
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  };
  const deepCopy = (o) => JSON.parse(JSON.stringify(o));
  return { mulberry32, esc, clamp, uid, iso, store, deepCopy };
})();

/* ---------- configuration (owner-editable; unknowns marked pending) ---------- */
ORION.defaultConfig = function () {
  return {
    version: 3,
    home: { id: 'home-demo', name: 'Demo Home (model house)' },
    timezone: 'Asia/Kolkata',
    tempUnit: 'C',
    freshness: { sensor_s: 30, heartbeat_s: 20 },
    rooms: {
      'mq2-hall': 'Hall',
      'flame-kitchen': 'Kitchen',
      'water-utility': 'Utility area',
      'dht22-living': 'Living room',
    },
    // App-side alert/display thresholds. The firmware's own thresholds are reported separately.
    thresholds: {
      mq2_warning: 350, mq2_critical: 500,
      water_wet: 300,
      temp_advisory_c: null, humidity_advisory: null,
    },
    notifications: { inapp: true, sms: false, call: false, recipients: [] },
    users: [{ name: 'Demo Owner', role: 'owner' }],
    configVersion: 'cfg-demo-3',
  };
};

/* Decisions the brief says must not be guessed. Shown across the app. */
ORION.pending = [
  { key: 'boards', title: 'UNO vs ESP32 responsibilities', detail: 'Planned (docs/hardware-architecture.md): the UNO reads all sensors and drives all outputs; the ESP32 is the Wi-Fi/MQTT gateway and runs the SIM800C. Not yet built or tested on hardware.' },
  { key: 'pins', title: 'Pin map and actual wiring', detail: 'No pins are shown or assumed anywhere in ORION.' },
  { key: 'mq2', title: 'MQ-2 calibration and thresholds', detail: 'Values are raw ADC, not ppm. 350/500 are placeholder thresholds.' },
  { key: 'mq2_level', title: 'Which MQ-2 level triggers local actions', detail: 'Demo firmware triggers fan, buzzer, LEDs and door at the warning threshold.' },
  { key: 'flame', title: 'Flame sensor polarity and output', detail: 'Active HIGH/LOW must be measured. Demo uses a digital detected/not-detected value.' },
  { key: 'flame_buzzer', title: 'Flame → buzzer rule', detail: 'The brief does not say whether flame sounds the buzzer. Demo firmware follows the brief literally (no buzzer).' },
  { key: 'flame_lights', title: 'Flame → white lights OFF', detail: 'The brief turns model lights off on flame. Confirm intent (cut kitchen power vs. lights for egress).' },
  { key: 'water', title: 'Water sensor type and threshold', detail: 'Demo treats raw ADC above 300 as wet.' },
  { key: 'water_notify', title: 'Water notification channel', detail: 'In-app only until SMS/call policy and recipients are defined.' },
  { key: 'smoke_sms', title: 'Smoke → SMS/call policy', detail: 'Not specified in the brief. No SMS is sent for smoke in the demo.' },
  { key: 'dht', title: 'DHT22 wiring, read interval and advisory thresholds', detail: 'Advisory thresholds are unset.' },
  { key: 'relay', title: 'Relay channel count, mapping and active level', detail: 'Not assumed active-LOW. Demo maps CH1 to the fan as an illustration.' },
  { key: 'mist', title: 'Mist maker', detail: 'Not in the current hardware inventory. Kept as a disabled placeholder; never activated automatically.' },
  { key: 'sg90', title: 'SG90 mechanical purpose', detail: 'Generic servo card only.' },
  { key: 'door', title: 'MG995 door policy', detail: 'MQ-2 only, 180° for 5 s (latest request). What happens after 5 s is unconfirmed; demo returns to 0°. Needs safety review before any real door.' },
  { key: 'gsm', title: 'SIM800C power and AT response reporting', detail: 'SIM800C is 2G-only. A Jio SIM will not register; use a 2G-capable network.' },
  { key: 'hosting', title: 'Where the ORION server runs', detail: 'LAN PC / Raspberry Pi or a cloud VPS. Simulation mode runs entirely in the browser.' },
  { key: 'recipients', title: 'Notification recipients', detail: 'None configured. Real alerts are disabled.' },
];

/* ---------- formatting ---------- */
ORION.fmt = (function () {
  const cache = {};
  function dtf(tz, opts) {
    const k = tz + JSON.stringify(opts);
    if (!cache[k]) {
      try { cache[k] = new Intl.DateTimeFormat('en-IN', Object.assign({ timeZone: tz }, opts)); }
      catch (e) { cache[k] = new Intl.DateTimeFormat('en-IN', opts); }
    }
    return cache[k];
  }
  function tzAbbr(tz) {
    if (tz === 'Asia/Kolkata' || tz === 'Asia/Calcutta') return 'IST';
    if (tz === 'UTC') return 'UTC';
    try {
      const p = dtf(tz, { timeZoneName: 'short' }).formatToParts(new Date()).find((x) => x.type === 'timeZoneName');
      return p ? p.value : tz;
    } catch (e) { return tz; }
  }
  const tz = () => (ORION.app && ORION.app.config.timezone) || 'Asia/Kolkata';
  return {
    time(ms) { return ms == null ? '—' : dtf(tz(), { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(ms); },
    hm(ms) { return dtf(tz(), { hour: '2-digit', minute: '2-digit', hour12: false }).format(ms); },
    day(ms) { return dtf(tz(), { day: 'numeric', month: 'short' }).format(ms); },
    dt(ms) {
      if (ms == null) return '—';
      return dtf(tz(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(ms) + ' ' + tzAbbr(tz());
    },
    tzAbbr: () => tzAbbr(tz()),
    ago(ms, now) {
      if (ms == null) return 'never';
      const s = Math.max(0, Math.round(((now || Date.now()) - ms) / 1000));
      if (s < 2) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ' + (s % 60) + 's ago';
      const h = Math.floor(m / 60);
      if (h < 48) return h + 'h ' + (m % 60) + 'm ago';
      return Math.floor(h / 24) + 'd ago';
    },
    dur(s) {
      s = Math.round(s);
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ' + (s % 60 ? (s % 60) + 's' : '');
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    },
    temp(c) {
      if (c == null) return '—';
      const u = (ORION.app && ORION.app.config.tempUnit) || 'C';
      return u === 'F' ? (c * 9 / 5 + 32).toFixed(1) : c.toFixed(1);
    },
    tempUnit() { return ((ORION.app && ORION.app.config.tempUnit) || 'C') === 'F' ? '°F' : '°C'; },
  };
})();

/* ---------- ESP32 setup code (decoded by hardware/lib/OrionCore/src/orion_setup.cpp) ---------- */
ORION.setupCode = {
  encode(c) {
    const f = ['ORION1', c.host, String(c.port || 1883), c.home, c.gateway, c.password, c.controller, c.gsm || '', c.mq2, c.flame, c.water, c.dht];
    if (f.some((x) => x == null || String(x).includes('|'))) throw new Error('setup code fields must not be empty or contain "|"');
    const bytes = new TextEncoder().encode(f.join('|'));
    let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
};

/* ORION native bridge — active only inside the Android app (Capacitor). In a browser this file does nothing.
 *
 *  - Sign-in: the app uses the "mobile" login flow; the refresh token is kept in app-private storage
 *    (Capacitor Preferences → Android SharedPreferences, readable only by this app) and rotated by the server.
 *  - Push: registers with Firebase Cloud Messaging, creates high-importance channels, sends the token to the server.
 *    Phones are a notification channel only — local protection never depends on them.
 *  - Speech: Android's own speech recognition and text-to-speech replace the browser APIs the WebView lacks.
 *  - Network: re-fetches and reconnects when connectivity returns.
 * Plugins are reached through Capacitor.registerPlugin (no bundler needed).
 */
'use strict';
(function () {
  const Cap = window.Capacitor;
  const NATIVE = !!(Cap && typeof Cap.isNativePlatform === 'function' && Cap.isNativePlatform());
  const P = (name) => (NATIVE && Cap.registerPlugin ? Cap.registerPlugin(name) : null);
  const Prefs = P('Preferences'), Push = P('PushNotifications'), Net = P('Network'), Speech = P('SpeechRecognition'), TTS = P('TextToSpeech');
  const RT_KEY = 'orion.refresh';

  const native = {
    isNative: NATIVE,
    async loadRefresh() { if (!Prefs) return null; try { const r = await Prefs.get({ key: RT_KEY }); return r && r.value ? r.value : null; } catch (e) { return null; } },
    async saveRefresh(token) { if (!Prefs) return; try { if (token) await Prefs.set({ key: RT_KEY, value: token }); else await Prefs.remove({ key: RT_KEY }); } catch (e) { /* storage unavailable */ } },

    _pushToken: null,
    async registerPush(source) {
      if (!Push) return { ok: false, error: 'not native' };
      try {
        await Push.createChannel({ id: 'orion_emergency', name: 'ORION emergencies', description: 'Smoke, flame and other critical alerts', importance: 5, visibility: 1, vibration: true });
        await Push.createChannel({ id: 'orion_alerts', name: 'ORION alerts', description: 'Warnings and connection problems', importance: 4, visibility: 1, vibration: true });
        let perm = await Push.checkPermissions();
        if (perm.receive === 'prompt' || perm.receive === 'prompt-with-rationale') perm = await Push.requestPermissions();
        if (perm.receive !== 'granted') return { ok: false, error: 'Notifications are turned off for ORION in Android settings.' };
        if (!native._wired) {
          native._wired = true;
          Push.addListener('registration', (t) => {
            native._pushToken = t.value;
            source.api('/push/register', { method: 'POST', body: { token: t.value, platform: 'android' } });
          });
          Push.addListener('registrationError', (e) => console.warn('push registration failed', e));
          Push.addListener('pushNotificationReceived', (n) => {
            if (ORION.app) { ORION.app.toast(n.title || 'ORION alert', 'bad'); if (ORION.app.source.refetch) ORION.app.source.refetch(); }
          });
          Push.addListener('pushNotificationActionPerformed', () => { if (ORION.app) ORION.app.go('alerts'); });
        }
        await Push.register();
        return { ok: true };
      } catch (e) { return { ok: false, error: String(e && e.message || e) }; }
    },
    async unregisterPush(source) {
      if (native._pushToken) await source.api('/push/unregister', { method: 'POST', body: { token: native._pushToken, platform: 'android' } });
    },

    watchNetwork(source) {
      if (!Net) return;
      Net.addListener('networkStatusChange', (s) => {
        if (s.connected && source && source.refetch) { source.refetch(); if (source._openWs) source._openWs(); }
      });
    },

    /* Same interface as the browser dictation adapter in aura-ai.js.
       With partialResults the plugin's start() resolves at once; the end of listening is the
       'listeningState' {status:'stopped'} event, and recognised words arrive as 'partialResults'. */
    dictation() {
      if (!Speech) return null;
      let on = false, last = '', guard = null;
      const L = { partial: [], final: [], state: [] };
      const fire = (k, v) => L[k].forEach((f) => { try { f(v); } catch (e) { console.error(e); } });
      const BCP = { en: 'en-IN', ml: 'ml-IN', hi: 'hi-IN', bn: 'bn-IN', ta: 'ta-IN', te: 'te-IN', kn: 'kn-IN', mr: 'mr-IN', gu: 'gu-IN', pa: 'pa-IN', or: 'or-IN', ur: 'ur-IN', as: 'as-IN' };
      const finish = (reason) => {
        if (!on) return;
        on = false; clearTimeout(guard);
        if (last) fire('final', { text: last + ' ' });
        last = ''; fire('partial', { text: '' });
        fire('state', { state: 'idle', reason: reason || 'stopped' });
      };
      // If Android reports nothing for a while (e.g. a recogniser error), don't leave the mic "listening" forever.
      const arm = () => { clearTimeout(guard); guard = setTimeout(() => { Speech.stop().catch(() => {}); finish('stopped'); }, 15000); };
      Speech.addListener('partialResults', (d) => { if (!on) return; last = (d.matches && d.matches[0]) || last; fire('partial', { text: last }); arm(); });
      Speech.addListener('listeningState', (d) => { if (d && d.status === 'stopped') finish('stopped'); });
      return {
        kind: 'native',
        active: () => on,
        onPartial: (f) => L.partial.push(f), onFinal: (f) => L.final.push(f), onState: (f) => L.state.push(f),
        async start(opts) {
          const perm = await Speech.requestPermissions().catch(() => ({ speechRecognition: 'denied' }));
          if (perm.speechRecognition !== 'granted') throw { code: 'not_granted' };
          const avail = await Speech.available().catch(() => ({ available: false }));
          if (!avail.available) throw { code: 'unavailable' };
          on = true; last = ''; arm();
          fire('state', { state: 'listening' });
          try {
            await Speech.start({ language: (opts && BCP[opts.language]) || 'en-IN', maxResults: 1, partialResults: true, popup: false });
          } catch (e) { finish('stopped'); throw { code: 'upstream_error' }; }
        },
        async stop() { try { await Speech.stop(); } catch (e) { /* not listening */ } finish('stopped'); },
      };
    },

    /* Android text-to-speech, used by Aura's "device voice" path. */
    speak(text, code, rate) {
      if (!TTS) return Promise.resolve();
      const BCP = { en: 'en-IN', ml: 'ml-IN', hi: 'hi-IN', bn: 'bn-IN', ta: 'ta-IN', te: 'te-IN', kn: 'kn-IN', mr: 'mr-IN', gu: 'gu-IN', pa: 'pa-IN', or: 'or-IN', ur: 'ur-IN', as: 'as-IN' };
      return TTS.speak({ text: String(text), lang: BCP[code] || 'en-IN', rate: rate || 1.0, volume: 1.0, category: 'playback' }).catch(() => {});
    },
    stopSpeaking() { if (TTS) TTS.stop().catch(() => {}); },

    /* Called once Aura's capability detection has run. */
    attachAura(AI) {
      if (!NATIVE || !AI) return;
      const d = native.dictation();
      if (d) AI.cap.dict = d;
      if (TTS) {
        AI.cap.browserTts = true;
        AI.speakBrowser = (text, code, onEnd, rate) => { native.speak(text, code, rate).then(() => onEnd && onEnd()); return true; };
        AI.deviceSay = (text, code, rate) => native.speak(text, code, rate);
        AI.stopBrowser = () => native.stopSpeaking();
      }
    },
  };

  ORION.native = native;
})();

/* ORION device registry helpers.
 *
 * The UI must not assume particular sensor or controller IDs: the live backend registers devices with its own IDs.
 * A snapshot carries `sensors` (keyed by sensor id, each with a `type`) and `controllers` (keyed by controller key,
 * one of which may be flagged `is_gateway`). Everything else (tiles, chart series, Aura context, settings rows)
 * is derived here from those objects.
 *
 * Series keys identify one measured quantity of one sensor: `<sensor_id>:<metric>`, e.g. `mq2-hall:mq2`.
 */
'use strict';
(function () {
  /* Sensor types ORION understands, in display order, with the metrics each one produces. */
  const TYPES = {
    mq2: { name: 'Smoke & gas', metrics: ['mq2'] },
    flame: { name: 'Flame', metrics: ['flame'] },
    water: { name: 'Water leak', metrics: ['water'] },
    dht22: { name: 'Temperature & humidity', metrics: ['temp', 'hum'] },
  };
  const TYPE_ORDER = Object.keys(TYPES);

  /* One measured quantity. `field` is the key inside sensor.fields. */
  const METRICS = {
    mq2: { type: 'mq2', field: 'raw_adc', name: 'Smoke & gas', label: 'MQ-2 (raw ADC)', unit: 'ADC', dp: 0, icon: 'smoke', color: '#f0a35e', aura: 'smoke' },
    flame: { type: 'flame', field: 'detected', name: 'Flame', label: 'Flame (detected)', unit: '0/1', dp: 0, icon: 'flame', color: '#ff6b6b', aura: 'flame' },
    water: { type: 'water', field: 'raw_adc', name: 'Water leak', label: 'Water (raw ADC)', unit: 'ADC', dp: 0, icon: 'water', color: '#7aa8ff', aura: 'water' },
    temp: { type: 'dht22', field: 'temperature_c', name: 'Temperature', label: 'Temperature', unit: '°C', dp: 1, icon: 'temp', color: '#ff8a7a', aura: 'temperature' },
    hum: { type: 'dht22', field: 'humidity_percent', name: 'Humidity', label: 'Humidity', unit: '%RH', dp: 1, icon: 'hum', color: '#6cc6e8', aura: 'humidity' },
  };

  const sensorList = (snap) => {
    if (!snap || !snap.sensors) return [];
    return Object.values(snap.sensors).sort((a, b) => {
      const ta = TYPE_ORDER.indexOf(a.type), tb = TYPE_ORDER.indexOf(b.type);
      return (ta < 0 ? 99 : ta) - (tb < 0 ? 99 : tb) || String(a.id).localeCompare(String(b.id));
    });
  };
  const sensorIds = (snap) => sensorList(snap).map((s) => s.id);
  /* First sensor of a type (most homes have one of each). */
  const sensorOfType = (snap, type) => sensorList(snap).find((s) => s.type === type) || null;

  const seriesKey = (sensorId, metric) => `${sensorId}:${metric}`;
  function parseSeries(key) {
    const s = String(key || ''), i = s.lastIndexOf(':');
    return i < 0 ? { sensorId: null, metric: s } : { sensorId: s.slice(0, i), metric: s.slice(i + 1) };
  }
  /* All chart series available in a snapshot, in display order. */
  function seriesList(snap) {
    const out = [];
    for (const s of sensorList(snap)) {
      const t = TYPES[s.type]; if (!t) continue;
      for (const m of t.metrics) out.push(Object.assign({ key: seriesKey(s.id, m), sensorId: s.id, metric: m }, METRICS[m]));
    }
    return out;
  }
  function seriesInfo(key) {
    const p = parseSeries(key), m = METRICS[p.metric];
    return m ? Object.assign({ key, sensorId: p.sensorId, metric: p.metric }, m) : null;
  }
  /* Series for the first sensor of the metric's type (used by Aura's sensor names). */
  function seriesForMetric(snap, metric) {
    const m = METRICS[metric]; if (!m) return null;
    const s = sensorOfType(snap, m.type);
    return s ? seriesKey(s.id, metric) : null;
  }

  /* Controller that relays telemetry to the backend (ESP32 in the ORION design). */
  function gatewayKey(snap) {
    if (!snap || !snap.controllers) return null;
    const e = Object.entries(snap.controllers).find(([, c]) => c.is_gateway);
    return e ? e[0] : null;
  }
  function controllerKeyById(snap, id) {
    if (!snap || !snap.controllers) return null;
    const e = Object.entries(snap.controllers).find(([k, c]) => c.id === id || k === id);
    return e ? e[0] : null;
  }

  /* Room shown for a sensor: owner's label in settings, else what the backend reports. */
  const roomOf = (cfg, sensor) => (cfg && cfg.rooms && cfg.rooms[sensor.id]) || sensor.room || '';

  ORION.registry = { TYPES, TYPE_ORDER, METRICS, sensorList, sensorIds, sensorOfType, seriesKey, parseSeries, seriesList, seriesInfo, seriesForMetric, gatewayKey, controllerKeyById, roomOf };
})();

/* ORION telemetry sources.
 *
 * ADAPTER BOUNDARY: the UI talks only to an object with this interface.
 *   kind            'demo' | 'live'
 *   start(onUpdate) begin delivering updates; onUpdate() is called after each change
 *   stop()
 *   snapshot()      -> { status: 'ok'|'loading'|'error'|'empty'|'unconfigured', ...data }
 *   history(series, fromMs, toMs) -> [{ t: recorded_ms, r: received_ms, v: number|null, q: quality }]
 *   acknowledge(incidentId, actor) -> { ok, error? }
 *   command({ actuator, action, actor }) -> command record (lifecycle updated over time)
 *
 * A Phase 2 LiveSource implements the same interface on top of the ORION backend
 * (REST: /api/v1/overview, /telemetry, /incidents, /commands … and SSE/WebSocket for realtime).
 */
'use strict';
(function () {
  const U = ORION.util;
  const MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;

  const SCENARIOS = [
    { id: 'normal', label: 'Normal', group: 'Baseline', hint: 'All sensors valid, controllers online.' },
    { id: 'smoke_warning', label: 'Smoke — warning', group: 'Hazards', hint: 'MQ-2 rises above the warning threshold.' },
    { id: 'smoke_critical', label: 'Smoke — critical', group: 'Hazards', hint: 'MQ-2 rises above the critical threshold.' },
    { id: 'flame', label: 'Flame detected', group: 'Hazards', hint: 'Flame sensor trips; GSM alert attempted.' },
    { id: 'water', label: 'Water leak', group: 'Hazards', hint: 'Water sensor reads wet.' },
    { id: 'mq2_warmup', label: 'MQ-2 warming up', group: 'Sensor health', hint: 'MQ-2 heater warm-up after power-on.' },
    { id: 'dht_fault', label: 'DHT22 read failure', group: 'Sensor health', hint: 'DHT22 reports checksum/read errors.' },
    { id: 'dht_stale', label: 'DHT22 stops reporting', group: 'Sensor health', hint: 'No DHT22 readings; goes stale.' },
    { id: 'uno_offline', label: 'UNO heartbeat lost', group: 'Connectivity', hint: 'Arduino UNO stops sending heartbeats.' },
    { id: 'gsm_outage', label: 'GSM not registered', group: 'Connectivity', hint: 'SIM800C loses network registration.' },
    { id: 'gateway_offline', label: 'ESP32 gateway offline', group: 'Connectivity', hint: 'No telemetry reaches the backend.' },
    { id: 'backend_error', label: 'Backend error', group: 'App states', hint: 'API returns errors.' },
    { id: 'loading', label: 'Loading', group: 'App states', hint: 'First load in progress.' },
    { id: 'no_data', label: 'No data yet', group: 'App states', hint: 'Fresh install, nothing received.' },
  ];

  /* Which sensor produces each simulated metric (history arrays are kept per metric). */
  const SIM_SENSOR = { mq2: 'mq2-hall', flame: 'flame-kitchen', water: 'water-utility', temp: 'dht22-living', hum: 'dht22-living' };

  /* Kerala-like diurnal pattern, peak mid-afternoon IST (≈08:30 UTC). */
  function diurnal(ms) {
    const hUTC = (ms % DAY) / HOUR;
    return Math.sin((2 * Math.PI * (hUTC - 2.5)) / 24); // +1 ≈ 08:30 UTC = 14:00 IST
  }

  class DemoSource {
    constructor(seed) {
      this.kind = 'demo';
      this.label = 'Simulation';
      this.seed = seed || 20261115;
      this.rand = U.mulberry32(this.seed + 7);
      this.scenario = 'normal';
      this.scenarioSince = Date.now();
      this.timer = null;
      this.listeners = [];
      this.t0 = Date.now();
      this.tickN = 0;
      this.seq = { esp32: 1800, uno: 940 };
      this.fwThresholds = { mq2_warning: 350, mq2_critical: 500, water_wet: 300 };
      this.events = []; this.logs = []; this.incidents = []; this.commands = []; this.gsmAttempts = [];
      this.seqGaps = 0;
      this._buildHistory();
      this._initLive();
      this._log('info', 'Simulation started (seed ' + this.seed + '). No hardware is connected — every value is simulated.');
    }

    /* ---------- history (deterministic) ---------- */
    _buildHistory() {
      const r = U.mulberry32(this.seed);
      const now = this.t0;
      const start = now - 7 * DAY;
      this.hist = { mq2: [], temp: [], hum: [], water: [], flame: [] };
      // planned past episodes (relative to load time)
      const ep = {
        smoke: [now - 26 * HOUR, now - 26 * HOUR + 7 * MIN],
        water: [now - 53 * HOUR, now - 53 * HOUR + 18 * MIN],
        flame: [now - 4 * DAY - 2 * HOUR, now - 4 * DAY - 2 * HOUR + 40e3],
        dhtGap: [now - 3 * HOUR - 20 * MIN, now - 3 * HOUR],
        gatewayGap: [now - 5 * DAY - 6 * HOUR, now - 5 * DAY - 5 * HOUR - 25 * MIN],
      };
      this.episodes = ep;
      let tWalk = 0, hWalk = 0, mWalk = 0;
      let t = start;
      while (t < now - 4e3) {
        const step = t < now - DAY ? 5 * MIN : MIN;
        tWalk = tWalk * 0.92 + (r() - 0.5) * 0.25;
        hWalk = hWalk * 0.92 + (r() - 0.5) * 1.2;
        mWalk = mWalk * 0.85 + (r() - 0.5) * 9;
        const inGw = t >= ep.gatewayGap[0] && t < ep.gatewayGap[1];
        if (!inGw) {
          const recv = t + 250 + Math.floor(r() * 900);
          const d = diurnal(t);
          // MQ-2
          let mq = 172 + mWalk + 6 * Math.sin(t / (37 * MIN));
          if (t >= ep.smoke[0] && t < ep.smoke[1]) {
            const p = (t - ep.smoke[0]) / (ep.smoke[1] - ep.smoke[0]);
            mq = 180 + 258 * Math.sin(Math.PI * Math.min(1, p * 1.15));
          }
          if (t >= ep.flame[0] - 2 * MIN && t < ep.flame[1] + 3 * MIN) mq = Math.max(mq, 290 + r() * 30);
          this.hist.mq2.push({ t, r: recv, v: Math.round(mq), q: 'valid', i: step });
          // DHT22
          if (!(t >= ep.dhtGap[0] && t < ep.dhtGap[1])) {
            this.hist.temp.push({ t, r: recv, v: +(28.4 + 3.1 * d + tWalk).toFixed(1), q: 'valid', i: step });
            this.hist.hum.push({ t, r: recv, v: +(73 - 9 * d + hWalk).toFixed(1), q: 'valid', i: step });
          }
          // water
          let w = 34 + Math.round((r() - 0.5) * 10);
          if (t >= ep.water[0] && t < ep.water[1]) w = 600 + Math.round(r() * 60);
          this.hist.water.push({ t, r: recv, v: w, q: 'valid', i: step });
          // flame
          const fl = t >= ep.flame[0] && t < ep.flame[1] + MIN ? 1 : 0;
          this.hist.flame.push({ t, r: recv, v: fl, q: 'valid', i: step });
        }
        t += step;
      }
      this._seedPastIncidents(ep);
    }

    _seedPastIncidents(ep) {
      const owner = 'Demo Owner';
      const mk = (o) => Object.assign({ acknowledged_by: null, acknowledged_at: null, events: [], actions: [] }, o);
      // Flame test 4 days ago
      const f0 = ep.flame[0];
      const flame = mk({
        id: 'inc-demo-0001', type: 'flame', source_id: 'flame-kitchen', source_label: 'Flame sensor · Kitchen',
        severity: 'critical', state: 'cleared', opened_at: f0, last_seen_at: ep.flame[1], cleared_at: ep.flame[1] + 45e3,
        acknowledged_by: owner, acknowledged_at: f0 + 70e3,
        snapshot: { value: 'detected', unit: 'digital', threshold: 'digital trip (polarity unverified)', config_version: 'cfg-demo-2' },
        actions: [
          { at: f0 + 300, actor: 'firmware', action: 'Red LED ON, green LED OFF', outcome: 'commanded' },
          { at: f0 + 300, actor: 'firmware', action: 'White + warm-white model lights OFF', outcome: 'commanded' },
          { at: f0 + 900, actor: 'firmware', action: 'SMS to Owner (demo)', outcome: 'sent — modem accepted (+CMGS); delivery not confirmed' },
          { at: f0 + 9000, actor: 'firmware', action: 'Voice call to Owner (demo)', outcome: 'timeout — no answer within 30 s' },

        { at: ep.flame[1], text: 'Flame no longer detected' },
        { at: ep.flame[1] + 45e3, text: 'Cleared: sensor normal for the clear-hold period' },
      ];
      // Water 53 h ago
      const w0 = ep.water[0];
      const water = mk({
        id: 'inc-demo-0002', type: 'water', source_id: 'water-utility', source_label: 'Water sensor · Utility area',
        severity: 'warning', state: 'cleared', opened_at: w0, last_seen_at: ep.water[1], cleared_at: ep.water[1] + 30e3,
        acknowledged_by: owner, acknowledged_at: w0 + 4 * MIN,
        snapshot: { value: 628, unit: 'adc_raw', threshold: 'wet ≥ 300 (placeholder)', config_version: 'cfg-demo-2' },
        actions: [{ at: w0 + 500, actor: 'backend', action: 'In-app notification', outcome: 'shown' },
          { at: w0 + 500, actor: 'backend', action: 'SMS', outcome: 'not_configured — water SMS policy pending' }],
      });
      water.events = [
        { at: w0, text: 'Water sensor reads wet (raw 628)' },
