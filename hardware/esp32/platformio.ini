; ORION gateway — ESP32 (Wi-Fi/MQTT to the server, SIM800C, link to the UNO).
; 1) cp include/secrets.example.h include/secrets.h and fill it in (never commit secrets.h)
; 2) pio run -t upload
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../lib
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.2.1
build_flags = -Wall
monitor_speed = 115200
