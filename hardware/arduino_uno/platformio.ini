; ORION safety controller — Arduino UNO.  Build: pio run   Upload: pio run -t upload
; Disconnect the ESP32 from D0/D1 while uploading.
[env:uno]
platform = atmelavr@5.1.0
board = uno
framework = arduino
lib_extra_dirs = ../lib
lib_deps = arduino-libraries/Servo@1.2.2
build_flags = -Wall
monitor_speed = 38400
