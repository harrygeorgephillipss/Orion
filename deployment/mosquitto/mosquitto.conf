# ORION MQTT broker. Plain listener is for the LAN/dev only; production should use 8883 with TLS (see docs/DEPLOYMENT.md).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
# Device messages are small; reject anything larger (protects the server from oversized payloads).
max_packet_size 65536

listener 1883 0.0.0.0

# TLS listener on 8883: added automatically by entrypoint.sh once Caddy has a certificate for ORION_DOMAIN.
include_dir /run/orion-tls/conf
