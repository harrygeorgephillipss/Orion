        { at: ep.water[1], text: 'Sensor reads dry' },
        { at: ep.water[1] + 30e3, text: 'Cleared: sensor normal for the clear-hold period' },
      ];
      // Smoke 26 h ago
      const s0 = ep.smoke[0];
      const smoke = mk({
        id: 'inc-demo-0003', type: 'smoke', source_id: 'mq2-hall', source_label: 'MQ-2 · Hall',
        severity: 'warning', state: 'cleared', opened_at: s0 + 40e3, last_seen_at: ep.smoke[1] - 50e3, cleared_at: ep.smoke[1] + 20e3,
        snapshot: { value: 438, unit: 'adc_raw (peak)', threshold: 'warning 350 / critical 500 (placeholder)', config_version: 'cfg-demo-3' },
        actions: [
          { at: s0 + 40.3e3, actor: 'firmware', action: 'Red LED ON, green LED OFF', outcome: 'commanded' },
          { at: s0 + 40.3e3, actor: 'firmware', action: 'Buzzer ON', outcome: 'commanded' },
          { at: s0 + 40.3e3, actor: 'firmware', action: 'Exhaust fan ON (relay CH1, demo mapping)', outcome: 'commanded — no feedback sensor' },
          { at: s0 + 40.4e3, actor: 'firmware', action: 'MG995 target 180° for 5 s', outcome: 'commanded — position not sensed' },
          { at: ep.smoke[1] - 50e3, actor: 'firmware', action: 'Buzzer OFF; fan cooldown 60 s started', outcome: 'commanded' },
          { at: ep.smoke[1] + 10e3, actor: 'firmware', action: 'Exhaust fan OFF (cooldown ended)', outcome: 'commanded' },
        ],
      });
      smoke.events = [
        { at: s0 + 40e3, text: 'MQ-2 above warning threshold (raw 352)' },
        { at: ep.smoke[1] - 50e3, text: 'MQ-2 below warning threshold' },
        { at: ep.smoke[1] + 20e3, text: 'Cleared: sensor normal for the clear-hold period' },
      ];
      // DHT gap 3 h ago
      const d0 = ep.dhtGap[0];
      const dht = mk({
        id: 'inc-demo-0004', type: 'sensor_fault', source_id: 'dht22-living', source_label: 'DHT22 · Living room',
        severity: 'degraded', state: 'cleared', opened_at: d0 + 30e3, last_seen_at: ep.dhtGap[1], cleared_at: ep.dhtGap[1] + 2e3,
        snapshot: { value: 'no readings', unit: '', threshold: 'freshness 30 s', config_version: 'cfg-demo-3' },
        actions: [],
      });
      dht.events = [{ at: d0 + 30e3, text: 'DHT22 readings stale (no data for 30 s)' }, { at: ep.dhtGap[1] + 2e3, text: 'DHT22 readings resumed' }];
      // Gateway gap 5 days ago
      const g0 = ep.gatewayGap[0];
      const gw = mk({
        id: 'inc-demo-0005', type: 'controller', source_id: 'orion-esp32-01', source_label: 'ESP32 gateway',
        severity: 'degraded', state: 'cleared', opened_at: g0 + 20e3, last_seen_at: ep.gatewayGap[1], cleared_at: ep.gatewayGap[1] + 3e3,
        snapshot: { value: 'heartbeat missing', unit: '', threshold: 'heartbeat 20 s', config_version: 'cfg-demo-2' },
        actions: [],
      });
      gw.events = [{ at: g0 + 20e3, text: 'ESP32 heartbeat missing — all telemetry stale' }, { at: ep.gatewayGap[1] + 3e3, text: 'ESP32 reconnected (boot reason: brownout)' }];

      this.incidents = [smoke, dht, water, gw, flame];
      for (const inc of this.incidents) {
        for (const e of inc.events) this.events.push({ id: U.uid('ev'), at: e.at, severity: inc.severity, source: inc.source_label, text: e.text, incident_id: inc.id });
      }
      this.events.push({ id: U.uid('ev'), at: ep.gatewayGap[1] + 3e3, severity: 'info', source: 'ESP32 gateway', text: 'Controller reconnected', incident_id: null });
      this.gsmAttempts.push(
        { id: 'gsm-demo-0001', type: 'sms', destination: 'Owner (demo) · +91 ••••• •••42', status: 'sent', note: 'Modem accepted (+CMGS: 41). Delivery not confirmed.', error_code: null, created_at: f0 + 400, updated_at: f0 + 900, incident_id: 'inc-demo-0001' },
        { id: 'gsm-demo-0002', type: 'call', destination: 'Owner (demo) · +91 ••••• •••42', status: 'timeout', note: 'Dialled; no answer within 30 s.', error_code: 'NO ANSWER', created_at: f0 + 1200, updated_at: f0 + 31200, incident_id: 'inc-demo-0001' },
      );
      this.events.sort((a, b) => b.at - a.at);
    }

    /* ---------- live simulation ---------- */
    _initLive() {
      const now = Date.now();
      const lastTemp = this.hist.temp[this.hist.temp.length - 1];
      const lastHum = this.hist.hum[this.hist.hum.length - 1];
      this.cur = { mq2: 175, temp: lastTemp ? lastTemp.v : 29, hum: lastHum ? lastHum.v : 72, water: 34, flame: 0 };
      this.sensors = {
        'mq2-hall': { id: 'mq2-hall', type: 'mq2', label: 'MQ-2 smoke / gas', controller: 'uno', simulated: true, unit: 'adc_raw', fields: { raw_adc: 175 }, state: 'normal', quality: 'valid', recorded_at: now, received_at: now, sequence: 0, calibration: 'uncalibrated_raw' },
        'flame-kitchen': { id: 'flame-kitchen', type: 'flame', label: 'Flame sensor', controller: 'uno', simulated: true, unit: 'digital', fields: { detected: false, digital_value: 1 }, state: 'normal', quality: 'valid', recorded_at: now, received_at: now, sequence: 0, polarity: 'active LOW (demo assumption)' },
        'water-utility': { id: 'water-utility', type: 'water', label: 'Water sensor', controller: 'uno', simulated: true, unit: 'adc_raw', fields: { raw_adc: 34, wet: false }, state: 'normal', quality: 'valid', recorded_at: now, received_at: now, sequence: 0 },
        'dht22-living': { id: 'dht22-living', type: 'dht22', label: 'DHT22 temperature / humidity', controller: 'uno', simulated: true, unit: 'c_rh', fields: { temperature_c: this.cur.temp, humidity_percent: this.cur.hum }, state: 'normal', quality: 'valid', recorded_at: now, received_at: now, sequence: 0 },
      };
      this.controllers = {
        uno: { id: 'orion-uno-01', name: 'Arduino UNO', role: 'Safety controller — reads sensors, drives outputs', is_gateway: false, simulated: true, online: true, last_seen_at: now, firmware_version: '0.1.0-sim', boot_reason: 'power_on', link: 'UART to ESP32 via level shifter', logic: '5 V' },
        esp32: { id: 'orion-esp32-01', name: 'ESP32', role: 'Gateway — Wi-Fi/MQTT to server, SIM800C', is_gateway: true, simulated: true, online: true, last_seen_at: now, firmware_version: '0.1.0-sim', boot_reason: 'power_on', wifi_rssi_dbm: -58, uptime_s: 5 * 3600 + 12 * 60, logic: '3.3 V (not 5 V tolerant)' },
      };
      this.gsm = { id: 'orion-sim800c-01', module: 'SIM800C', simulated: true, network_registered: true, operator: 'Simulated 2G network', csq: 17, last_report_at: now, power: 'external supply (unconfirmed)' };
      this.fw = { smoke: false, smokeLevel: 'normal', flame: false, water: false, fanCooldownUntil: null, doorUntil: null, manualFan: null, buzzerTestUntil: null, normalSince: {} };
      this.act = {
        fan: { id: 'fan', name: '12 V exhaust fan', commanded: 'off', by: 'firmware', last_changed_at: now - 26 * HOUR, feedback: false },
        relay: { id: 'relay', name: '5 V relay module', channels: [{ ch: 1, load: 'Exhaust fan (planned mapping, unverified)', commanded: 'de-energised' }], active_level: 'unverified', feedback: false },
        mist: { id: 'mist', name: 'Mist maker', installed: false, commanded: 'off', interlock: 'undefined', remote: 'disabled', feedback: false },
        mg995: { id: 'mg995', name: 'MG995 servo — model door', target_angle: 0, duration_s: null, command_time: now - 26 * HOUR, reported_position: null, feedback: false },
        sg90: { id: 'sg90', name: 'SG90 servo — purpose pending', target_angle: null, command_time: null, reported_position: null, feedback: false },
        buzzer: { id: 'buzzer', name: 'Buzzer', commanded: 'off', pattern: null, incident_id: null, feedback: false },
        leds: { id: 'leds', name: 'Indicator LEDs', items: [
          { id: 'led-green', name: 'Green — status normal', color: 'green', commanded: 'on' },
          { id: 'led-red', name: 'Red — warning', color: 'red', commanded: 'off' },
          { id: 'led-white', name: 'White — model lighting', color: 'white', commanded: 'on' },
          { id: 'led-warm', name: 'Warm-white — model lighting', color: 'warm', commanded: 'on' },
        ], feedback: false },
      };
      this.live = { mq2: [], temp: [], hum: [], water: [], flame: [] };
      this.warmupUntil = null;
      this.gsmOutage = false;
    }

    setScenario(id) {
      if (!SCENARIOS.find((s) => s.id === id)) return;
      const prev = this.scenario;
      this.scenario = id;
      this.scenarioSince = Date.now();
      if (id === 'mq2_warmup') this.warmupUntil = Date.now() + 60e3;
      this._log('info', `Demo scenario changed: ${prev} → ${id}`);
      this._event('info', 'Demo controls', `Scenario set to “${SCENARIOS.find((s) => s.id === id).label}”`);
      this._tick();
    }

    start(cb) {
      if (cb) this.listeners.push(cb);
      if (!this.timer) {
        this._tick();
        this.timer = setInterval(() => this._tick(), 2000);
      }
    }
    stop() { clearInterval(this.timer); this.timer = null; }
    _emit() { for (const l of this.listeners) { try { l(); } catch (e) { console.error(e); } } }

    _log(level, msg) { this.logs.unshift({ at: Date.now(), level, msg }); if (this.logs.length > 200) this.logs.pop(); }
    _event(sev, source, text, incident_id) {
      this.events.unshift({ id: U.uid('ev'), at: Date.now(), severity: sev, source, text, incident_id: incident_id || null });
      if (this.events.length > 400) this.events.pop();
    }

    _tick() {
      const now = Date.now();
      const r = this.rand;
      const sc = this.scenario;
      this.tickN++;
      const gatewayUp = sc !== 'gateway_offline';
      const unoUp = sc !== 'uno_offline' && gatewayUp;

      // physical targets (what the sensors would "see")
      let mq2T = 172, flame = 0, waterT = 34;
      if (sc === 'smoke_warning') mq2T = 428;
      if (sc === 'smoke_critical') mq2T = 588;
      if (sc === 'flame') { flame = 1; mq2T = 315; }
      if (sc === 'water') waterT = 640;
      this.cur.mq2 += (mq2T - this.cur.mq2) * 0.35 + (r() - 0.5) * 10;
      this.cur.water += (waterT - this.cur.water) * 0.5 + (r() - 0.5) * 8;
      this.cur.flame = flame;
      const d = diurnal(now);
      this.cur.temp += (28.4 + 3.1 * d - this.cur.temp) * 0.05 + (r() - 0.5) * 0.08;
      this.cur.hum += (73 - 9 * d - this.cur.hum) * 0.05 + (r() - 0.5) * 0.4;

      /* --- simulated local firmware (runs even when the gateway is offline) --- */
      this._firmware(now);

      /* --- telemetry reaching the backend ---
         Sensors are read by the UNO and relayed by the ESP32, so both links must be up for fresh readings. */
      if (gatewayUp) {
        // occasional dropped packet → sequence gap (deterministic)
        if (this.tickN % 157 === 0) { this.seq.esp32++; this.seqGaps++; this._log('warn', 'Sequence gap detected on orion-esp32-01 (1 message missing)'); }
        const recv = now;
        const rec = now - 300 - Math.floor(r() * 500);
        const s = this.sensors;
        const fw = this.fwThresholds;
        if (unoUp) {
          // MQ-2
          const mqv = Math.round(U.clamp(this.cur.mq2, 0, 1023));
          const warm = this.warmupUntil && now < this.warmupUntil;
          if (this.warmupUntil && now >= this.warmupUntil) {
            this.warmupUntil = null;
            if (sc === 'mq2_warmup') { this.scenario = 'normal'; this._event('info', 'MQ-2 · Hall', 'MQ-2 warm-up complete'); }
          }
          Object.assign(s['mq2-hall'], {
            fields: { raw_adc: mqv }, quality: warm ? 'warming_up' : 'valid',
            warmup_remaining_s: warm ? Math.ceil((this.warmupUntil - now) / 1000) : 0,
            state: warm ? 'unknown' : mqv >= fw.mq2_critical ? 'critical' : mqv >= fw.mq2_warning ? 'warning' : 'normal',
            recorded_at: rec, received_at: recv, sequence: ++this.seq.esp32,
            fw_threshold: { warning: fw.mq2_warning, critical: fw.mq2_critical },
          });
          this._push('mq2', rec, recv, warm ? null : mqv, warm ? 'warming_up' : 'valid');
          // flame (active LOW demo assumption: digital 0 = detected)
          Object.assign(s['flame-kitchen'], {
            fields: { detected: !!flame, digital_value: flame ? 0 : 1 }, quality: 'valid',
            state: flame ? 'critical' : 'normal', recorded_at: rec, received_at: recv, sequence: ++this.seq.esp32,
          });
          this._push('flame', rec, recv, flame, 'valid');
          // water
          const wv = Math.round(U.clamp(this.cur.water, 0, 1023));
          const wet = wv >= fw.water_wet;
          Object.assign(s['water-utility'], {
            fields: { raw_adc: wv, wet }, quality: 'valid', state: wet ? 'warning' : 'normal',
            recorded_at: rec, received_at: recv, sequence: ++this.seq.esp32, fw_threshold: { wet: fw.water_wet },
          });
          this._push('water', rec, recv, wv, 'valid');
          // DHT22
          if (sc === 'dht_fault') {
            Object.assign(s['dht22-living'], { fields: { temperature_c: null, humidity_percent: null }, quality: 'fault', fault: 'read failure (checksum / timeout)', state: 'unknown', recorded_at: rec, received_at: recv, sequence: ++this.seq.esp32 });
            if (this.tickN % 3 === 0) this._log('warn', 'dht22-living: read failure reported by controller');
          } else if (sc !== 'dht_stale') {
            const tv = +this.cur.temp.toFixed(1), hv = +U.clamp(this.cur.hum, 0, 100).toFixed(1);
            Object.assign(s['dht22-living'], { fields: { temperature_c: tv, humidity_percent: hv }, quality: 'valid', fault: null, state: 'normal', recorded_at: rec, received_at: recv, sequence: ++this.seq.esp32 });
            this._push('temp', rec, recv, tv, 'valid');
            this._push('hum', rec, recv, hv, 'valid');
          }
        } // unoUp
        // controllers
        this.controllers.esp32.online = true;
        this.controllers.esp32.last_seen_at = recv;
        this.controllers.esp32.uptime_s += 2;
        this.controllers.esp32.wifi_rssi_dbm = -56 - Math.round(r() * 6);
        if (unoUp) { this.controllers.uno.last_seen_at = recv; this.seq.uno++; }
        // GSM status report
        this.gsmOutage = sc === 'gsm_outage';
        this.gsm.network_registered = !this.gsmOutage;
        this.gsm.csq = this.gsmOutage ? 99 : 15 + Math.round(r() * 4);
        this.gsm.operator = this.gsmOutage ? null : 'Simulated 2G network';
        this.gsm.last_report_at = recv;
      }
      this._progressGsm(now);
      this._progressCommands(now, gatewayUp && unoUp);
      this._incidentEngine(now);
      this._emit();
    }

    _push(series, t, r, v, q) {
      const a = this.live[series];
      a.push({ t, r, v, q, i: 2000 });
      if (a.length > 20000) a.shift();
    }

    _firmware(now) {
      const fw = this.fw, A = this.act, th = this.fwThresholds;
      const warm = this.warmupUntil && now < this.warmupUntil;
      const mq = this.cur.mq2;
      const smokeOn = !warm && (fw.smoke ? mq >= th.mq2_warning - 25 : mq >= th.mq2_warning); // hysteresis
      const led = (id, v) => { const l = A.leds.items.find((x) => x.id === id); l.commanded = v; };

      if (smokeOn && !fw.smoke) {
        fw.smoke = true;
        A.buzzer.commanded = 'on'; A.buzzer.pattern = 'continuous'; A.buzzer.last_changed_at = now;
        A.fan.commanded = 'on'; A.fan.by = 'firmware (smoke rule)'; A.fan.last_changed_at = now; fw.fanCooldownUntil = null;
        A.mg995.target_angle = 180; A.mg995.duration_s = 5; A.mg995.command_time = now; fw.doorUntil = now + 5000;
        this._fwAction('smoke', 'Red LED ON, green LED OFF; buzzer ON; exhaust fan ON; MG995 target 180° for 5 s');
      } else if (!smokeOn && fw.smoke) {
        fw.smoke = false;
        A.buzzer.commanded = 'off'; A.buzzer.pattern = null; A.buzzer.last_changed_at = now;
        fw.fanCooldownUntil = now + 60e3;
        this._fwAction('smoke', 'Smoke ended: buzzer OFF; fan cooldown 60 s started');
      }
      if (fw.doorUntil && now >= fw.doorUntil) {
        fw.doorUntil = null; A.mg995.target_angle = 0; A.mg995.duration_s = null; A.mg995.command_time = now;
        this._fwAction('smoke', 'MG995 target returned to 0° after 5 s (post-5 s behaviour pending confirmation)');
      }
      if (fw.fanCooldownUntil && now >= fw.fanCooldownUntil) {
        fw.fanCooldownUntil = null;
        if (fw.manualFan !== 'on') { A.fan.commanded = 'off'; A.fan.by = 'firmware (cooldown ended)'; A.fan.last_changed_at = now; }
        this._fwAction('smoke', 'Exhaust fan OFF (60 s cooldown ended)');
      }
      // flame
      const fl = !!this.cur.flame;
      if (fl && !fw.flame) {
        fw.flame = true;
        led('led-white', 'off'); led('led-warm', 'off');
        this._fwAction('flame', 'Red LED ON, green LED OFF; white + warm-white lights OFF; GSM SMS and call requested');
        this._gsmRequest('sms', 'flame'); this._gsmRequest('call', 'flame');
      } else if (!fl && fw.flame) {
        fw.flame = false;
        led('led-white', 'on'); led('led-warm', 'on');
        this._fwAction('flame', 'Flame ended: model lights restored (restore rule pending confirmation)');
      }
      fw.water = this.cur.water >= th.water_wet;
      // buzzer test
      if (fw.buzzerTestUntil && now >= fw.buzzerTestUntil) {
        fw.buzzerTestUntil = null;
        if (!fw.smoke) { A.buzzer.commanded = 'off'; A.buzzer.pattern = null; }
      }
      // manual fan
      if (fw.manualFan === 'on' && !fw.smoke && !fw.fanCooldownUntil) { A.fan.commanded = 'on'; }
      // indicators
      const hazard = fw.smoke || fw.flame;
      led('led-red', hazard ? 'on' : 'off');
      led('led-green', hazard ? 'off' : 'on');
      A.relay.channels[0].commanded = A.fan.commanded === 'on' ? 'energised' : 'de-energised';
      A.fan.cooldown_remaining_s = fw.fanCooldownUntil ? Math.ceil((fw.fanCooldownUntil - now) / 1000) : 0;
    }

    _fwAction(type, text) {
      this._pendingActions = this._pendingActions || [];
      this._pendingActions.push({ type, at: Date.now(), text });
    }

    _gsmRequest(kind, type) {
      const now = Date.now();
      const a = { id: U.uid('gsm'), type: kind, destination: 'Owner (demo) · +91 ••••• •••42', status: 'queued', note: 'Queued on controller', error_code: null, created_at: now, updated_at: now, incident_type: type, incident_id: null, _t: now };
      this.gsmAttempts.unshift(a);
      this._log('info', `GSM ${kind.toUpperCase()} queued (${type})`);
    }

    _progressGsm(now) {
      for (const a of this.gsmAttempts) {
        if (!a._t) continue;
        const age = now - a._t;
        const prev = a.status;
        if (this.gsmOutage && (a.status === 'queued' || a.status === 'sending')) {
          a.status = 'failed'; a.error_code = 'NOT REGISTERED'; a.note = 'Modem not registered on network (AT+CREG?).'; delete a._t;
        } else if (a.type === 'sms') {
          if (a.status === 'queued' && age > 2000) { a.status = 'sending'; a.note = 'AT+CMGS issued'; }
          else if (a.status === 'sending' && age > 7000) { a.status = 'sent'; a.note = 'Modem accepted (+CMGS). Delivery not confirmed.'; delete a._t; }
        } else {
          if (a.status === 'queued' && age > 4000) { a.status = 'sending'; a.note = 'Dialling (ATD)…'; }
          else if (a.status === 'sending' && age > 34000) { a.status = 'timeout'; a.error_code = 'NO ANSWER'; a.note = 'Dialled; no answer within 30 s.'; delete a._t; }
        }
        if (a.status !== prev) { a.updated_at = now; this._log(a.status === 'failed' || a.status === 'timeout' ? 'warn' : 'info', `GSM ${a.type.toUpperCase()} ${a.id}: ${prev} → ${a.status}`); }
      }
    }

    /* ---------- backend-side incident engine (demo) ---------- */
    _incidentEngine(now) {
      const fresh = (ORION.app ? ORION.app.config.freshness.sensor_s : 30) * 1000;
      const hb = (ORION.app ? ORION.app.config.freshness.heartbeat_s : 20) * 1000;
      const CLEAR_HOLD = 10e3;
      const sensors = this.sensors;
      const BASE = { mq2: 'MQ-2', flame: 'Flame sensor', water: 'Water sensor', dht22: 'DHT22' };
      const labelOf = (id) => {
        const s = sensors[id];
        const room = s && ORION.app ? ORION.registry.roomOf(ORION.app.config, s) : '';
        const base = (s && BASE[s.type]) || id;
        return room ? `${base} · ${room}` : base;
      };
      const conds = [];
      const stale = (s) => now - s.received_at > fresh;
      // hazards (device-reported states are authoritative)
      const mq = sensors['mq2-hall'];
      if (!stale(mq) && (mq.state === 'warning' || mq.state === 'critical')) conds.push({ key: 'mq2', type: 'smoke', source_id: mq.id, severity: mq.state, value: mq.fields.raw_adc, unit: 'adc_raw', threshold: `warning ${mq.fw_threshold.warning} / critical ${mq.fw_threshold.critical} (firmware, placeholder)` });
      const fl = sensors['flame-kitchen'];
      if (!stale(fl) && fl.state === 'critical') conds.push({ key: 'flame', type: 'flame', source_id: fl.id, severity: 'critical', value: 'detected', unit: 'digital', threshold: 'digital trip (polarity unverified)' });
      const wa = sensors['water-utility'];
      if (!stale(wa) && wa.state === 'warning') conds.push({ key: 'water', type: 'water', source_id: wa.id, severity: 'warning', value: wa.fields.raw_adc, unit: 'adc_raw', threshold: `wet ≥ ${wa.fw_threshold ? wa.fw_threshold.wet : 300} (placeholder)` });
      // degraded conditions
      // When the gateway is down, report one root-cause incident instead of one per downstream sensor.
      const gw = Object.values(this.controllers).find((c) => c.is_gateway);
      const gatewayDown = now - gw.last_seen_at > hb;
      const ctrlDown = (k) => this.controllers[k] && now - this.controllers[k].last_seen_at > hb;
      for (const s of Object.values(sensors)) {
        if (gatewayDown) break;
        if (stale(s) && ctrlDown(s.controller)) continue; // root cause is the controller, reported below
        if (stale(s)) conds.push({ key: 'stale:' + s.id, type: 'sensor_stale', source_id: s.id, severity: 'degraded', value: 'no readings', unit: '', threshold: `freshness ${fresh / 1000} s` });
        else if (s.quality === 'fault') conds.push({ key: 'fault:' + s.id, type: 'sensor_fault', source_id: s.id, severity: 'degraded', value: s.fault || 'fault', unit: '', threshold: 'quality = valid' });
      }
      for (const c of Object.values(this.controllers)) {
        if (gatewayDown && c !== gw) continue;
        if (now - c.last_seen_at > hb) conds.push({ key: 'hb:' + c.id, type: 'controller', source_id: c.id, severity: 'degraded', value: c === gw ? 'gateway heartbeat missing — all telemetry stale' : 'heartbeat missing — its sensors are stale', unit: '', threshold: `heartbeat ${hb / 1000} s`, label: c.name });
      }
      if (now - this.gsm.last_report_at <= hb && !this.gsm.network_registered) conds.push({ key: 'gsm', type: 'gsm', source_id: this.gsm.id, severity: 'degraded', value: 'not registered', unit: '', threshold: 'network registered', label: 'SIM800C GSM' });

      this.openKeys = this.openKeys || {};
      const pend = this._pendingActions || [];
      this._pendingActions = [];
      const active = new Set();
      for (const c of conds) {
        active.add(c.key);
        let inc = this.openKeys[c.key] && this.incidents.find((i) => i.id === this.openKeys[c.key]);
        const label = c.label || labelOf(c.source_id);
        if (!inc || inc.state === 'cleared') {
          inc = {
            id: 'inc-' + Date.now().toString(36) + '-' + Math.floor(this.rand() * 1e4).toString(36),
            key: c.key, type: c.type, source_id: c.source_id, source_label: label, severity: c.severity, state: 'active',
            opened_at: now, last_seen_at: now, cleared_at: null, acknowledged_by: null, acknowledged_at: null,
            snapshot: { value: c.value, unit: c.unit, threshold: c.threshold, config_version: ORION.app ? ORION.app.config.configVersion : '' },
            actions: [], events: [{ at: now, text: `Opened: ${c.type.replace('_', ' ')} (${c.severity})` }], _normalSince: null,
          };
          if (c.type === 'water') inc.actions.push({ at: now, actor: 'backend', action: 'In-app notification', outcome: 'shown' }, { at: now, actor: 'backend', action: 'SMS', outcome: 'not_configured — water SMS policy pending' });
          if (c.type === 'smoke') inc.actions.push({ at: now, actor: 'backend', action: 'SMS / call', outcome: 'none — smoke SMS policy not specified' });
          this.incidents.unshift(inc);
          this.openKeys[c.key] = inc.id;
          this._event(c.severity, label, `Incident opened — ${c.type.replace('_', ' ')} (${c.severity.toUpperCase()})`, inc.id);
          this._log(c.severity === 'degraded' ? 'warn' : 'error', `Incident ${inc.id} opened: ${c.key} ${c.severity}`);
        } else {
          inc.last_seen_at = now; inc._normalSince = null;
          if (c.severity === 'critical' && inc.severity === 'warning') {
            inc.severity = 'critical';
            inc.events.push({ at: now, text: 'Escalated to CRITICAL' });
            this._event('critical', label, 'Incident escalated to CRITICAL', inc.id);
          }
          if (typeof c.value === 'number' && (typeof inc.snapshot.peak !== 'number' || c.value > inc.snapshot.peak)) inc.snapshot.peak = c.value;
        }
      }
      // attach firmware-reported actions to the matching hazard incident
      for (const p of pend) {
        const key = p.type === 'smoke' ? 'mq2' : p.type;
        const inc = this.openKeys[key] && this.incidents.find((i) => i.id === this.openKeys[key]);
        if (inc) {
          inc.actions.push({ at: p.at, actor: 'firmware', action: p.text, outcome: 'reported by controller' });
          inc.events.push({ at: p.at, text: 'Firmware reported: ' + p.text });
          if (p.type === 'flame') for (const a of this.gsmAttempts) if (!a.incident_id && a.incident_type === 'flame') a.incident_id = inc.id;
        }
        this._event('info', p.type === 'flame' ? 'Flame response' : 'Smoke response', 'Firmware reported: ' + p.text, inc ? inc.id : null);
      }
      // GSM attempt outcomes into flame incident action log
      for (const a of this.gsmAttempts) {
        if (!a.incident_id) continue;
        const inc = this.incidents.find((i) => i.id === a.incident_id);
        if (!inc || inc.id.startsWith('inc-demo')) continue;
        const label = (a.type === 'sms' ? 'SMS' : 'Voice call') + ' to ' + a.destination.split(' · ')[0];
        let row = inc.actions.find((x) => x.gsm === a.id);
        if (!row) { row = { at: a.created_at, actor: 'firmware', action: label, outcome: '', gsm: a.id }; inc.actions.push(row); }
        row.outcome = a.status + (a.note ? ' — ' + a.note : '');
      }
      // clearing: based on sensor/state logic, never on a button
      for (const [key, id] of Object.entries(this.openKeys)) {
        if (active.has(key)) continue;
        const inc = this.incidents.find((i) => i.id === id);
        if (!inc || inc.state === 'cleared') { delete this.openKeys[key]; continue; }
        // A hazard whose sensor has gone silent is NOT cleared: absence of data is not "normal".
        const src = sensors[inc.source_id];
        if (src && stale(src) && ['smoke', 'flame', 'water'].includes(inc.type)) {
          if (!inc._heldStale) { inc._heldStale = true; inc.events.push({ at: now, text: 'Source sensor stale — incident held open (cannot confirm the hazard has cleared)' }); }
          inc._normalSince = null;
          continue;
        }
        inc._heldStale = false;
        if (!inc._normalSince) { inc._normalSince = now; inc.events.push({ at: now, text: 'Condition no longer reported; clear-hold started (10 s)' }); }
        if (now - inc._normalSince >= CLEAR_HOLD) {
          inc.state = 'cleared'; inc.cleared_at = now;
          inc.events.push({ at: now, text: 'Cleared: condition normal for the clear-hold period' });
          this._event('info', inc.source_label, 'Incident cleared by sensor/state logic', inc.id);
          delete this.openKeys[key];
        }
      }
    }

    /* ---------- adapter interface ---------- */
    snapshot() {
      const sc = this.scenario;
      if (sc === 'loading') return { status: 'loading' };
      if (sc === 'backend_error') return { status: 'error', error: { code: 503, message: 'GET /api/v1/overview failed: 503 Service Unavailable (simulated)' }, at: Date.now() };
      if (sc === 'no_data') return { status: 'empty', at: Date.now() };
      return {
        status: 'ok', mode: 'demo', simulated: true, at: Date.now(),
        sensors: this.sensors, controllers: this.controllers, gsm: this.gsm, gsmAttempts: this.gsmAttempts,
        actuators: this.act, incidents: this.incidents, events: this.events, commands: this.commands, logs: this.logs,
        fwThresholds: this.fwThresholds, fwState: { fanCooldownRemaining: this.act.fan.cooldown_remaining_s, smoke: this.fw.smoke, flame: this.fw.flame },
        pipeline: { seqGaps: this.seqGaps, seq: this.seq },
      };
    }

    history(key, from, to) {
      if (this.scenario === 'no_data') return [];
      const { sensorId, metric } = ORION.registry.parseSeries(key);
      if (sensorId && SIM_SENSOR[metric] !== sensorId) return [];
      const out = [];
      for (const arr of [this.hist[metric], this.live[metric]]) {
        if (!arr) continue;
        for (const p of arr) if (p.t >= from && p.t <= to) out.push(p);
      }
      return out;
    }

    acknowledge(id, actor) {
      if (this.scenario === 'backend_error') return { ok: false, error: 'Backend unavailable — acknowledgement not recorded.' };
      const inc = this.incidents.find((i) => i.id === id);
      if (!inc) return { ok: false, error: 'Incident not found' };
      if (inc.acknowledged_at) return { ok: false, error: 'Already acknowledged' };
      inc.acknowledged_by = actor; inc.acknowledged_at = Date.now();
      inc.events.push({ at: inc.acknowledged_at, text: `Acknowledged by ${actor} — acknowledgement does not clear or silence the hazard` });
      this._event('info', inc.source_label, `Acknowledged by ${actor}`, inc.id);
      this._log('info', `audit: incident.acknowledge ${inc.id} by ${actor}`);
      this._emit();
      return { ok: true };
    }

    command({ actuator, action, actor }) {
      const now = Date.now();
      const cmd = { id: 'cmd-' + now.toString(36), actuator, action, requested_by: actor, created_at: now, expires_at: now + 30e3, status: 'requested', completed_at: null, result: null, simulated: true, history: [{ at: now, status: 'requested', note: `${actor} requested ${actuator} → ${action}` }] };
      this.commands.unshift(cmd);
      this._log('info', `audit: command.create ${cmd.id} ${actuator}:${action} by ${actor}`);
      this._emit();
      return { ok: true, command: cmd };
    }

    _progressCommands(now, gatewayUp) {
      for (const c of this.commands) {
        if (['completed', 'failed', 'rejected', 'expired', 'unknown'].includes(c.status)) continue;
        const age = now - c.created_at;
        const step = (status, note) => { c.status = status; c.history.push({ at: now, status, note }); };
        if (this.scenario === 'backend_error' && c.status === 'requested') { step('failed', 'Backend unavailable; command not queued'); c.completed_at = now; continue; }
        if (c.status === 'requested' && age >= 600) step('queued', 'Backend validated permissions, allowlist, expiry and interlocks (simulated)');
        else if (c.status === 'queued' && age >= 1800) {
          if (gatewayUp) step('sent', 'Transmitted to gateway'); else step('sent', 'Transmit attempted; gateway not acknowledging');
        } else if (c.status === 'sent') {
          if (!gatewayUp) { if (now > c.expires_at) { step('expired', 'No device response before expiry (30 s)'); c.completed_at = now; } continue; }
          if (age < 3500) continue;
          const fw = this.fw;
          if (c.actuator === 'fan' && c.action === 'off' && (fw.smoke || fw.fanCooldownUntil)) {
            step('rejected', 'Device local rule: fan held ON during smoke / cooldown'); c.completed_at = now; c.result = 'rejected_by_interlock'; continue;
          }
          step('accepted', 'Controller accepted command');
          if (c.actuator === 'fan') { fw.manualFan = c.action; this.act.fan.commanded = c.action === 'on' ? 'on' : (fw.smoke || fw.fanCooldownUntil ? 'on' : 'off'); this.act.fan.by = 'user command (simulated)'; this.act.fan.last_changed_at = now; }
          if (c.actuator === 'buzzer') { fw.buzzerTestUntil = now + 2000; this.act.buzzer.commanded = 'on'; this.act.buzzer.pattern = 'test (2 s)'; }
          c._acceptedAt = now;
        } else if (c.status === 'accepted' && now - c._acceptedAt >= 1500) {
          step('unknown', 'Output driven by controller; physical result unverified (no feedback sensor)');
          c.completed_at = now; c.result = 'executed_unverified';
        }
      }
      this._firmware(now);
    }
  }

  /* Phase 2 placeholder: same interface, no data until a backend exists. Never fabricates. */
  class LiveSource {
    constructor() { this.kind = 'live'; this.label = 'Live backend'; }
    start() {} stop() {}
    snapshot() { return { status: 'unconfigured', message: 'No ORION backend is configured. Live telemetry arrives in Phase 2 (backend + ESP32 gateway).' }; }
    history() { return []; }
    acknowledge() { return { ok: false, error: 'No backend configured' }; }
    command() { return { ok: false, error: 'No backend configured — the command was not sent.' }; }
    setScenario() {}
  }

  ORION.sources = { DemoSource, LiveSource, SCENARIOS, SIM_SENSOR };
})();

/* ORION live data source: the same adapter interface as the simulation (see sources.js), backed by the ORION server.
 *
 *  - REST  /api/v1/...  for the overview snapshot, history, acknowledgements and commands
 *  - WebSocket /api/v1/ws for real-time events (on any event the overview is re-fetched, debounced)
 *  - Access token kept in memory only. Browsers keep the refresh token in an httpOnly cookie set by the server;
 *    the Android app (Phase 5) keeps it in secure storage.
 *  - When the server can't be reached the snapshot becomes an explicit error — values are never invented or kept
 *    looking current. A periodic 2 s tick re-evaluates freshness even when no messages arrive.
 */
'use strict';
(function () {
  const U = ORION.util;
  const SERVER_KEY = 'orion.server';

  /* Base URL of the ORION server: saved setting, else the page's own origin when served over http(s). */
  function serverBase() {
    const saved = U.store.get(SERVER_KEY, '');
    if (saved) return String(saved).replace(/\/+$/, '');
    if (ORION.native && ORION.native.isNative) return '';  // the app's own origin is not a server: the address must be set
    if (/^https?:$/.test(location.protocol)) return location.origin;
    return '';
  }

  class LiveSource {
    constructor() {

      this.snap = this.base ? { status: 'loading' } : { status: 'unconfigured', message: 'No ORION server address is set. Add it in Settings → Data, or open ORION from your server.' };
      this.listeners = []; this.hist = new Map(); this.timer = null; this.ws = null; this.wsBackoff = 1000; this.stopped = false;
      this.wsState = 'closed'; this._refetchT = null; this._inflight = null;

    /* ---------- lifecycle ---------- */
    start(cb) {

    stop() {

    }
    _emit() { for (const l of this.listeners) { try { l(); } catch (e) { console.error(e); } } }

    async _boot() {

          this._emit();

    async login(email, password) {

      try {
        r = await fetch(this.base + '/api/v1/auth/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, client: ORION.native && ORION.native.isNative ? 'mobile' : 'web' }) });

      await this._afterAuth();
      return { ok: true, user: j.user };
    }
    async logout() {
      const N = ORION.native && ORION.native.isNative ? ORION.native : null;
      if (N) { await N.unregisterPush(this).catch(() => {}); }
      const rt = N ? await N.loadRefresh() : null;
      try { await fetch(this.base + '/api/v1/auth/logout', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rt ? { refresh_token: rt } : {}) }); } catch (e) { /* offline */ }
      if (N) await N.saveRefresh(null);
      this.token = null; this.user = null;
      if (this.ws) { try { this.ws.close(); } catch (e) { /* closed */ } this.ws = null; }
      this.hist.clear();
      this.snap = { status: 'auth', message: 'Signed out.' };
      if (ORION.app) ORION.app.user = { name: 'Signed out', role: 'viewer' };
      this._emit();
    }

    /* Authenticated request; on 401 tries one refresh, then reports "sign in". */
    async api(path, opts) {
      if (!this.base) return { ok: false, status: 0, data: {}, error: 'No ORION server is configured.' };
      try { return await this._api(path, opts); } catch (e) {
        return { ok: false, status: 0, data: {}, error: 'Cannot reach the ORION server.' };
      }
    }
    async _api(path, opts) {
      const o = Object.assign({ method: 'GET' }, opts || {});
      const go = () => fetch(this.base + '/api/v1' + path, { method: o.method, credentials: 'include', headers: Object.assign({ 'Content-Type': 'application/json' }, this.token ? { Authorization: 'Bearer ' + this.token } : {}), body: o.body === undefined ? undefined : JSON.stringify(o.body) });
      let r = await go();
      if (r.status === 401 && await this._refresh()) r = await go();
      if (r.status === 401) { this.token = null; this.snap = { status: 'auth', message: 'Your session ended — sign in again.' }; this._emit(); }
      const j = await r.json().catch(() => ({}));
      return { ok: r.ok, status: r.status, data: j, error: r.ok ? null : (typeof j.detail === 'string' ? j.detail : 'Request failed (' + r.status + ')') };
    }

    /* ---------- data ---------- */
    refetch() {
      if (this._inflight) return this._inflight;
      this._inflight = (async () => {
        try {
          const r = await this.api('/overview');
          if (r.ok) this.snap = r.data;
          else if (r.status === 0 && !this.base) this.snap = { status: 'unconfigured', message: r.error };
          else if (r.status !== 401) this.snap = { status: 'error', error: { code: r.status, message: 'GET /api/v1/overview failed: ' + r.error }, at: Date.now() };
        } catch (e) {
          this.snap = { status: 'error', error: { code: 'network', message: 'Lost connection to the ORION server' }, at: Date.now() };
        } finally { this._inflight = null; }
        this._emit();
      })();
      return this._inflight;
    }
    _soon() { clearTimeout(this._refetchT); this._refetchT = setTimeout(() => this.refetch(), 250); }
    async _loadConfig() {
      const r = await this.api('/config').catch(() => null);
      if (!r || !r.ok || !ORION.app) return;
      const c = ORION.app.config, v = (k) => r.data[k] && r.data[k].value;
      if (v('freshness')) c.freshness = Object.assign({}, c.freshness, v('freshness'));
      if (v('thresholds')) c.thresholds = Object.assign({}, c.thresholds, v('thresholds'));
      if (v('rooms')) c.rooms = Object.assign({}, c.rooms, v('rooms'));
      if (v('home')) { c.home = Object.assign({}, c.home, { name: v('home').name }); c.timezone = v('home').timezone || c.timezone; }
      this.serverConfig = r.data;
    }

    _openWs() {
      if (this.stopped || !this.token || this.ws) return;
      const url = this.base.replace(/^http/, 'ws') + '/api/v1/ws';
      let ws;
      try { ws = new WebSocket(url); } catch (e) { return this._wsRetry(); }
      this.ws = ws; this.wsState = 'connecting';
      ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token: this.token }));
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'ready') { this.wsState = 'open'; this.wsBackoff = 1000; this.refetch(); return; }
        if (m.type === 'tick') return;
        if (m.type === 'incident_opened' && ORION.app && ORION.app.toast) {
          ORION.app.toast((m.simulated ? '[Simulated] ' : '') + 'New alert: ' + (m.source || m.incident_type) + ' (' + String(m.severity).toUpperCase() + ')', m.severity === 'critical' ? 'bad' : '');
        }
        this._soon();
      };
      ws.onclose = (ev) => {
        this.ws = null; this.wsState = 'closed';
        if (ev.code === 4401 && !this.stopped) { this._refresh().then((ok) => { if (ok) this._openWs(); }); return; }
        this._wsRetry();
      };
      ws.onerror = () => { /* onclose follows */ };
    }
    _wsRetry() {
      if (this.stopped) return;
      this.refetch(); // shows OFFLINE/error state promptly if the server is gone
      setTimeout(() => this._openWs(), this.wsBackoff);
      this.wsBackoff = Math.min(this.wsBackoff * 2, 30000);
    }

    snapshot() { return this.snap; }

    /* Synchronous for the UI: returns cached points and fetches in the background, then re-renders. */
    history(key, from, to) {
      if (!this.token || !key) return [];
      const span = Math.round((to - from) / 60e3);
      const ck = key + '|' + span;
      const c = this.hist.get(ck);
      const now = Date.now();
      if (!c || (now - c.at > 15000 && !c.loading)) {
        const entry = c || { at: 0, pts: [] };
        entry.loading = true; this.hist.set(ck, entry);
        const q = '/telemetry?series=' + encodeURIComponent(key) + '&from=' + Math.floor(from) + '&to=' + Math.ceil(to) + '&max_points=' + (span > 1440 ? 1500 : 2000);
        this.api(q).then((r) => { entry.loading = false; entry.at = Date.now(); if (r.ok) { entry.pts = r.data.points; this._emit(); } }, () => { entry.loading = false; entry.at = Date.now(); });
      }
      return (c ? c.pts : []).filter((p) => p.t >= from && p.t <= to);
    }

    async acknowledge(id) {
      const r = await this.api('/incidents/' + encodeURIComponent(id) + '/ack', { method: 'POST' });
      if (r.ok) this.refetch();
      return { ok: r.ok, error: r.error };
    }
    async command({ actuator, action }) {
      const r = await this.api('/commands', { method: 'POST', body: { actuator, action } });
      this.refetch();
      if (!r.ok) return { ok: false, error: r.error };
      if (r.data.status === 'failed') return { ok: false, error: r.data.history[r.data.history.length - 1].note, command: r.data };
      return { ok: true, command: r.data };
    }
    /* Server voice: upload a recording for transcription / fetch speech audio. Errors come back as {ok:false}. */
    async voiceTranscribe(blob, lang) {
      try {
        const go = () => fetch(this.base + '/api/v1/aura/voice/transcribe?language=' + encodeURIComponent(lang), { method: 'POST', credentials: 'include', headers: { 'Content-Type': blob.type || 'audio/webm', Authorization: 'Bearer ' + this.token }, body: blob });
        let r = await go();
        if (r.status === 401 && await this._refresh()) r = await go();
        const j = await r.json().catch(() => ({}));
        if (r.ok) return { ok: true, text: j.text || '' };
        const d = j.detail || {};
        return { ok: false, code: d.code || String(r.status), error: d.message || 'speech service error' };
      } catch (e) { return { ok: false, code: 'network', error: 'connection lost' }; }
    }
    async voiceSpeak(body) {
      try {
        const go = () => fetch(this.base + '/api/v1/aura/voice/speak', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token }, body: JSON.stringify(body) });
        let r = await go();
        if (r.status === 401 && await this._refresh()) r = await go();
        if (!r.ok) { const j = await r.json().catch(() => ({})); return { ok: false, code: (j.detail && j.detail.code) || String(r.status) }; }
        return { ok: true, blob: await r.blob() };
      } catch (e) { return { ok: false, code: 'network' }; }
    }
    async putConfig(key, value) { return this.api('/config/' + key, { method: 'PUT', body: value }); }
    setScenario() { /* simulation only */ }
  }

  LiveSource.serverBase = serverBase;
  LiveSource.SERVER_KEY = SERVER_KEY;
  ORION.sources.LiveSource = LiveSource;
})();

/* ORION health evaluation: freshness, sensor status and overall system state.
 * Precedence: OFFLINE (no valid controller link) > EMERGENCY > ATTENTION > DEGRADED > NORMAL.
 * A degraded condition never hides an emergency; stale/missing data never shows NORMAL.
 * Sensors and controllers come from the snapshot (see registry.js) — no IDs are assumed. */
'use strict';
(function () {
  const R = ORION.registry;

  function evaluate(snap, cfg, now) {
    now = now || Date.now();
    const out = { status: snap.status, system: null, reasons: [], notes: [], sensors: {}, controllers: {}, gsm: null, active: [], lastKnown: null, now, gateway: null };
    if (snap.status === 'loading') { out.system = 'LOADING'; return out; }
    if (snap.status === 'error') { out.system = 'OFFLINE'; out.reasons.push('Backend error: ' + ((snap.error && snap.error.message) || 'unknown error')); out.backendError = true; return out; }
    if (snap.status === 'empty') { out.system = 'OFFLINE'; out.reasons.push('No telemetry has been received yet.'); out.noData = true; return out; }
    if (snap.status === 'unconfigured') { out.system = 'OFFLINE'; out.reasons.push(snap.message || 'No data source configured.'); out.unconfigured = true; return out; }
    if (snap.status === 'auth') { out.system = 'OFFLINE'; out.reasons.push(snap.message || 'Sign in to see live data.'); out.needsAuth = true; return out; }

    const fresh = cfg.freshness.sensor_s * 1000, hb = cfg.freshness.heartbeat_s * 1000;
    for (const [k, c] of Object.entries(snap.controllers || {})) {
      const age = c.last_seen_at == null ? Infinity : now - c.last_seen_at;
      // `connected: false` = the server knows the link dropped (MQTT last-will / UNO link loss) — offline now.
      out.controllers[k] = { online: age <= hb && c.connected !== false, age, disconnected: c.connected === false };
    }
    const sensors = R.sensorList(snap);
    for (const s of sensors) {
      const age = s.received_at == null ? Infinity : now - s.received_at;
      const ck = s.controller && out.controllers[s.controller] ? s.controller : null;
      let status = 'live';
      if (age > fresh) status = 'stale';
      else if (s.quality === 'fault') status = 'fault';
      else if (s.quality === 'warming_up') status = 'warming_up';
      else if (s.quality === 'disconnected') status = 'disconnected';
      out.sensors[s.id] = { status, age, stale: age > fresh, controllerOffline: !!(ck && !out.controllers[ck].online) };
    }
    const g = snap.gsm || null;
    if (g) {
      const gAge = g.last_report_at == null ? Infinity : now - g.last_report_at;
      out.gsm = { reported: gAge <= hb, age: gAge, registered: gAge <= hb && !!g.network_registered };
    } else out.gsm = { reported: false, age: Infinity, registered: false, missing: true };

    out.active = (snap.incidents || []).filter((i) => i.state !== 'cleared');
    const hazards = out.active.filter((i) => i.severity === 'critical' || i.severity === 'warning');
    const crit = hazards.some((i) => i.severity === 'critical');

    const degraded = [];
    const secs = (ms) => (ms === Infinity ? 'ever' : Math.round(ms / 1000) + ' s');
    for (const s of sensors) {
      const e = out.sensors[s.id], name = s.label || s.id;
      if (e.status === 'stale' && e.controllerOffline) continue; // reported once, as its controller
      if (e.status === 'stale') degraded.push(`${name}: no reading for ${secs(e.age)}`);
      if (e.status === 'fault') degraded.push(`${name}: sensor fault reported`);
      if (e.status === 'warming_up') degraded.push(`${name}: warming up — readings not yet valid`);
      if (e.status === 'disconnected') degraded.push(`${name}: disconnected`);
    }
    if (!sensors.length) degraded.push('No sensors are registered.');
    for (const [k, c] of Object.entries(out.controllers)) if (!c.online) degraded.push(`${snap.controllers[k].name}: heartbeat missing`);
    if (out.gsm.missing) degraded.push('SIM800C: not registered with ORION');
    else if (!out.gsm.reported) degraded.push('SIM800C: no status report');
    else if (!out.gsm.registered) degraded.push('SIM800C: not registered on network — SMS/call alerts unavailable');

    // No valid controller link: the gateway is silent, or (if no gateway is flagged) every controller is silent.
    const gk = R.gatewayKey(snap);
    out.gateway = gk;
    const ctrls = Object.values(out.controllers);
    const gatewayDown = gk ? !out.controllers[gk].online : (ctrls.length === 0 || ctrls.every((c) => !c.online));
    if (gatewayDown) {
      out.system = 'OFFLINE';
      const g = gk ? out.controllers[gk] : null;
      const who = !gk ? 'no controller heartbeat'
        : g.disconnected ? `${snap.controllers[gk].name} gateway disconnected (last heard ${secs(g.age)} ago)`
          : `${snap.controllers[gk].name} gateway heartbeat missing for ${secs(g.age)}`;
      out.reasons.push(`No valid controller connection: ${who}. All values below are last-known and stale.`);
      if (hazards.length) out.lastKnown = crit ? 'EMERGENCY' : 'ATTENTION';
      out.notes = degraded;
      return out;
    }
    if (crit) out.system = 'EMERGENCY';
    else if (hazards.length) out.system = 'ATTENTION';
    else if (degraded.length) out.system = 'DEGRADED';
    else out.system = 'NORMAL';
    for (const h of hazards) out.reasons.push(`${h.severity.toUpperCase()}: ${h.source_label}`);
    if (out.system === 'DEGRADED') out.reasons = degraded.slice();
    else out.notes = degraded;
    return out;
  }

  ORION.state = { evaluate, sensorOrder: (snap) => R.sensorIds(snap) };
})();

/* ORION SVG time-series charts: readable axes, units, thresholds, incident markers, gap breaks, hover readout. */
'use strict';
(function () {
  const U = ORION.util, F = ORION.fmt;
  const reg = {};
  let cid = 0;

  function tzOffsetMs(tz) {
    try {
      const d = new Date();
      const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(d);
      const g = (t) => +p.find((x) => x.type === t).value;
      const asUTC = Date.UTC(g('year'), g('month') - 1, g('day'), g('hour') % 24, g('minute'), g('second'));
      return asUTC - (d.getTime() - d.getMilliseconds());
    } catch (e) { return 0; }
  }
  function niceStep(span, n) {
    const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  }
  const TSTEPS = [60e3, 5 * 60e3, 10 * 60e3, 15 * 60e3, 30 * 60e3, 3600e3, 2 * 3600e3, 3 * 3600e3, 6 * 3600e3, 12 * 3600e3, 86400e3];

  function segments(points) {
    const segs = []; let cur = [];
    for (let k = 0; k < points.length; k++) {
      const p = points[k], prev = points[k - 1];
      if (p.v == null) { if (cur.length) segs.push(cur); cur = []; continue; }
      if (prev && prev.v != null) {
        const gapLim = Math.max(10e3, 3 * Math.max(prev.i || 60e3, p.i || 60e3));
        if (p.t - prev.t > gapLim) { if (cur.length) segs.push(cur); cur = []; }
      }
      cur.push(p);
    }
    if (cur.length) segs.push(cur);
    return segs;
  }
  function decimate(seg, max) {
    if (seg.length <= max) return seg;
    const k = Math.ceil(seg.length / (max / 2)); const out = [];
    for (let s = 0; s < seg.length; s += k) {
      const ch = seg.slice(s, s + k); let lo = ch[0], hi = ch[0];
      for (const p of ch) { if (p.v < lo.v) lo = p; if (p.v > hi.v) hi = p; }
      if (lo.t <= hi.t) { out.push(lo); if (hi !== lo) out.push(hi); } else { out.push(hi); out.push(lo); }
    }
    return out;
  }

  /* opts: { points, from, to, unit, dp, color, thresholds:[{v,label,sev}], markers:[{t0,t1,sev,label}], step, height, yMin, yMax, title, emptyText } */
  function render(opts) {
    const id = 'ch' + (++cid);
    const W = Math.max(300, Math.round(opts.width || 860)), H = opts.height || 240, L = 52, R = 16, T = 18, B = 30;
    const iw = W - L - R, ih = H - T - B;
    const pts = opts.points || [];
    const valid = pts.filter((p) => p.v != null);
    const tz = ORION.app.config.timezone;
    if (!valid.length) {
      return `<div class="chart-empty" role="img" aria-label="${U.esc(opts.title || 'chart')}: no data"><div class="ce-icon">∅</div><div>${U.esc(opts.emptyText || 'No stored readings in this time range.')}</div></div>`;
    }
    let lo = opts.yMin != null ? opts.yMin : Math.min(...valid.map((p) => p.v));
    let hi = opts.yMax != null ? opts.yMax : Math.max(...valid.map((p) => p.v));
    for (const t of opts.thresholds || []) if (t.v != null && opts.yMax == null) { hi = Math.max(hi, t.v); lo = Math.min(lo, t.v); }
    if (hi === lo) { hi += 1; lo -= 1; }
    if (opts.yMin == null) { const pad = (hi - lo) * 0.1; lo -= pad; hi += pad; }
    const ys = niceStep(hi - lo, 4);
    lo = Math.floor(lo / ys) * ys; hi = Math.ceil(hi / ys) * ys;
    const x = (t) => L + ((t - opts.from) / (opts.to - opts.from)) * iw;
    const y = (v) => T + ih - ((v - lo) / (hi - lo)) * ih;
    let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" id="${id}" role="img" aria-label="${U.esc(opts.title || '')} chart, ${U.esc(F.dt(opts.from))} to ${U.esc(F.dt(opts.to))}, unit ${U.esc(opts.unit)}">`;
    // markers (incidents)
    for (const m of opts.markers || []) {
      const a = Math.max(opts.from, m.t0), b = Math.min(opts.to, m.t1 || opts.to);
      if (b < opts.from || a > opts.to) continue;
      const xa = x(a), xb = Math.max(x(b), xa + 2);
      svg += `<rect x="${xa.toFixed(1)}" y="${T}" width="${(xb - xa).toFixed(1)}" height="${ih}" class="mk mk-${m.sev}"><title>${U.esc(m.label)}</title></rect>`;
      svg += `<line x1="${xa.toFixed(1)}" x2="${xa.toFixed(1)}" y1="${T}" y2="${T + ih}" class="mkl mk-${m.sev}"/>`;
      svg += `<text x="${(xa + 3).toFixed(1)}" y="${T + 10}" class="mkt mkt-${m.sev}">${U.esc(m.short || m.sev.toUpperCase())}</text>`;
    }
    // y grid
    for (let v = lo; v <= hi + ys / 2; v += ys) {
      const yy = y(v).toFixed(1);
      svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="grid"/>`;
      svg += `<text x="${L - 8}" y="${+yy + 4}" class="axis" text-anchor="end">${opts.binary ? (v === 1 ? 'yes' : v === 0 ? 'no' : '') : +v.toFixed(ys < 1 ? 1 : 0)}</text>`;
    }
    svg += `<text x="${L - 8}" y="${T - 6}" class="axis unit" text-anchor="end">${U.esc(opts.unit)}</text>`;
    // x ticks aligned to local time
    const span = opts.to - opts.from;
    const tstep = TSTEPS.find((s) => span / s <= 7) || 86400e3;
    const off = tzOffsetMs(tz);
    let t0 = Math.ceil((opts.from + off) / tstep) * tstep - off;
    for (let t = t0; t <= opts.to; t += tstep) {
      const xx = x(t).toFixed(1);
      svg += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ih}" class="grid v"/>`;
      const lab = tstep >= 86400e3 ? F.day(t) : (span > 86400e3 ? F.day(t) + ' ' + F.hm(t) : F.hm(t));
      svg += `<text x="${xx}" y="${H - 10}" class="axis" text-anchor="middle">${U.esc(lab)}</text>`;
    }
    // thresholds
    for (const th of opts.thresholds || []) {
      if (th.v == null || th.v < lo || th.v > hi) continue;
      const yy = y(th.v).toFixed(1);
      svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="thr thr-${th.sev}"/>`;
      svg += `<text x="${W - R - 4}" y="${+yy - 4}" class="thrt thr-${th.sev}" text-anchor="end">${U.esc(th.label)}</text>`;
    }
    // data + gap shading
    const segs = segments(pts.filter((p) => p.t >= opts.from && p.t <= opts.to));
    for (let s = 1; s < segs.length; s++) {
      const a = segs[s - 1][segs[s - 1].length - 1].t, b = segs[s][0].t;
      const xa = x(a), xb = x(b);
      if (xb - xa < 1) continue;
      svg += `<rect x="${xa.toFixed(1)}" y="${T}" width="${(xb - xa).toFixed(1)}" height="${ih}" class="gap"><title>No data ${U.esc(F.dt(a))} – ${U.esc(F.dt(b))}</title></rect>`;
      if (xb - xa > 34) svg += `<text x="${((xa + xb) / 2).toFixed(1)}" y="${T + ih - 6}" class="gapt" text-anchor="middle">no data</text>`;
    }
    for (const seg of segs) {
      const d = decimate(seg, 1400);
      let path = '';
      d.forEach((p, k) => {
        const xx = x(p.t).toFixed(1), yy = y(p.v).toFixed(1);
        if (k === 0) path += `M${xx},${yy}`;
        else if (opts.step) path += `H${xx}V${yy}`;
        else path += `L${xx},${yy}`;
      });
      if (d.length === 1) svg += `<circle cx="${x(d[0].t).toFixed(1)}" cy="${y(d[0].v).toFixed(1)}" r="2.5" fill="${opts.color}"/>`;
      svg += `<path d="${path}" fill="none" stroke="${opts.color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
    }
    svg += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" style="display:none"/><circle class="xhd" r="3.5" fill="${opts.color}" style="display:none"/>`;
    svg += `<rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit" data-chart="${id}"/>`;
    svg += '</svg>';
    reg[id] = { pts: valid, all: pts, from: opts.from, to: opts.to, L, iw, T, ih, lo, hi, W, unit: opts.unit, dp: opts.dp || 0, binary: opts.binary };
    return `<div class="chart-wrap">${svg}<div class="ctip" id="${id}-tip" hidden></div></div>`;
  }

  function onMove(ev) {
    const hit = ev.target.closest && ev.target.closest('.hit');
    if (!hit) return;
    const c = reg[hit.dataset.chart]; if (!c) return;
    const svg = hit.ownerSVGElement, box = svg.getBoundingClientRect();
    const sx = ((ev.clientX - box.left) / box.width) * c.W;
    const t = c.from + ((sx - c.L) / c.iw) * (c.to - c.from);
    let a = 0, b = c.pts.length - 1;
    while (b - a > 1) { const m = (a + b) >> 1; if (c.pts[m].t < t) a = m; else b = m; }
    const p = Math.abs(c.pts[a].t - t) < Math.abs(c.pts[b].t - t) ? c.pts[a] : c.pts[b];
    const tip = document.getElementById(hit.dataset.chart + '-tip');
    const xh = svg.querySelector('.xh'), dot = svg.querySelector('.xhd');
    const gapLim = Math.max(10e3, 3 * (p.i || 60e3));
    const px = c.L + ((p.t - c.from) / (c.to - c.from)) * c.iw;
    const py = c.T + c.ih - ((p.v - c.lo) / (c.hi - c.lo)) * c.ih;
    xh.setAttribute('x1', sx); xh.setAttribute('x2', sx); xh.style.display = '';
    let html;
    if (Math.abs(p.t - t) > gapLim) {
      dot.style.display = 'none';
      html = `<b>No data</b><span>${U.esc(F.dt(t))}</span>`;
    } else {
      dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.display = '';
      const val = c.binary ? (p.v ? 'detected' : 'not detected') : p.v.toFixed(c.dp) + ' ' + c.unit;
      html = `<b>${U.esc(val)}</b><span>${U.esc(F.dt(p.t))}</span><span class="muted">quality: ${U.esc(p.q)} · delay ${((p.r - p.t) / 1000).toFixed(1)} s</span>`;
    }
    tip.innerHTML = html; tip.hidden = false;
    const rel = (ev.clientX - box.left) / box.width;
    tip.style.left = rel > 0.65 ? '' : `calc(${(rel * 100).toFixed(1)}% + 12px)`;
    tip.style.right = rel > 0.65 ? `calc(${((1 - rel) * 100).toFixed(1)}% + 12px)` : '';
  }
  function onLeave(ev) {
    const hit = ev.target.closest && ev.target.closest('.hit');
    if (!hit) return;
    const svg = hit.ownerSVGElement;
    svg.querySelector('.xh').style.display = 'none'; svg.querySelector('.xhd').style.display = 'none';
    const tip = document.getElementById(hit.dataset.chart + '-tip'); if (tip) tip.hidden = true;
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseout', onLeave);

  /* compact sparkline for cards */
  function spark(points, color, from, to) {
    const v = points.filter((p) => p.v != null);
    if (v.length < 2) return '<div class="spark-empty">no recent history</div>';
    const W = 200, H = 36;
    let lo = Math.min(...v.map((p) => p.v)), hi = Math.max(...v.map((p) => p.v));
    if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
    const segs = segments(points.filter((p) => p.t >= from));
    let d = '';
    for (const s of segs) decimate(s, 120).forEach((p, k) => {
      d += (k ? 'L' : 'M') + (((p.t - from) / (to - from)) * W).toFixed(1) + ',' + (H - 3 - ((p.v - lo) / (hi - lo)) * (H - 6)).toFixed(1);
    });
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
  }

  ORION.charts = { render, spark, reset() { for (const k of Object.keys(reg)) delete reg[k]; } };
})();

/* Aura — Phase 1 MOCK assistant. Rule-based; reads only the current ORION snapshot.
 * Not an AI model. Phase 4 replaces answer() with backend-mediated model calls + permission-checked data tools. */
'use strict';
(function () {
  const F = ORION.fmt;

  const SUGGEST = ['What is the current temperature?', 'Why did ORION raise an alert?', 'Show the latest water-sensor event', 'Is the ESP32 online?', 'Is the GSM module working?', 'Is my home safe right now?'];

  function freshTag(ev, id) {
    const s = ev.sensors[id];
    if (!s) return 'unavailable';
    return { live: 'fresh', stale: 'STALE', fault: 'FAULT', warming_up: 'warming up', disconnected: 'disconnected', no_data: 'no data' }[s.status] || s.status;
  }

  function answer(q, snap, ev, cfg) {
    const t = q.toLowerCase();
    const res = { facts: [], interp: '', caveats: [], links: [] };
    const now = Date.now();
    const demo = snap.mode === 'demo' || snap.simulated === true;
    if (demo) res.caveats.push('All values are SIMULATED test data, not readings from your hardware.');
    else if (snap.contains_simulated) res.caveats.push('Some devices on this server are simulated; their values are not hardware readings.');

    // safety-first intents
    if (/(there'?s|there is|i see|real)\s+(a )?(fire|smoke)|help|emergency|burning|evacuat/.test(t)) {
      res.emergency = true; res.caveats = [];
      res.interp = 'If you believe there is a real fire, gas leak or emergency, do not wait for ORION or for me. Leave the building, keep others out and call emergency services: 112 (national emergency) or 101 (fire) in India. ORION is a prototype and not a certified alarm.';
      return res;
    }
    if (/(turn|switch)\s+(on|off)|open (the )?door|unlock|disable|silence|mute|change (the )?threshold|set (the )?threshold|activate|start (the )?(fan|mist)/.test(t)) {
      res.refusal = true; res.caveats = [];
      res.interp = 'I can’t operate devices, change thresholds, unlock doors or disable alarms. Any allowed action has to go through the Devices page, where it needs your explicit confirmation and is logged with its real result.';
      res.links.push({ href: '#devices', label: 'Open Devices & actuators' });
      return res;
    }
    if (snap.status !== 'ok') {
      res.interp = snap.status === 'error' ? 'I can’t reach ORION data right now (backend error), so I can’t tell you any current values. I won’t guess.'
        : snap.status === 'empty' ? 'ORION has not received any telemetry yet, so there is nothing to report.'
          : snap.status === 'unconfigured' ? 'No ORION server is connected, so I have no readings. Add the server address in Settings, or use Simulation mode to explore.'
            : snap.status === 'auth' ? 'Please sign in to ORION first — I only report data you are allowed to see.'
            : 'Data is still loading.';
      return res;
    }
    const R = ORION.registry;
    const sensorOf = (type) => R.sensorOfType(snap, type);
    const missing = (what) => { res.interp = `No ${what} is registered in ORION, so I have no reading to report.`; return res; };
    const fact = (label, value, id, at) => res.facts.push({ label, value, at, status: id ? freshTag(ev, id) : null });

    if (/temp|hot|cold|warm|°/.test(t) && !/humid/.test(t)) {
      const d = sensorOf('dht22'); if (!d) return missing('temperature sensor');
      const st = freshTag(ev, d.id);
      if (d.fields.temperature_c == null) {
        fact('Temperature (DHT22)', 'no valid reading', d.id, d.recorded_at);
        res.interp = 'The DHT22 is not giving a valid temperature right now' + (d.fault ? ` (${d.fault})` : '') + '. I can’t tell you the current temperature.';
      } else {
        fact('Temperature (DHT22 · ' + R.roomOf(cfg, d) + ')', F.temp(d.fields.temperature_c) + ' ' + F.tempUnit(), d.id, d.recorded_at);
        fact('Humidity', d.fields.humidity_percent + ' %RH', d.id, d.recorded_at);
        res.interp = st === 'fresh' ? 'This is the latest reading and it is within the freshness window.' : `This value is ${st}: it is the last-known reading, not a current one.`;
        if (cfg.thresholds.temp_advisory_c == null) res.caveats.push('No temperature advisory threshold is configured, so I can’t say whether this is “too high”.');
      }
      return res;
    }
    if (/humid/.test(t)) {
      const d = sensorOf('dht22'); if (!d) return missing('humidity sensor');
      fact('Humidity (DHT22)', d.fields.humidity_percent == null ? 'no valid reading' : d.fields.humidity_percent + ' %RH', d.id, d.recorded_at);
      res.interp = d.fields.humidity_percent == null ? 'The DHT22 is not providing a valid humidity reading.' : 'Relative humidity from the DHT22. No advisory threshold is set.';
      return res;
    }
    if (/why|alert|alarm|incident|what happened/.test(t)) {
      const act = snap.incidents.filter((i) => i.state !== 'cleared');
      const inc = act[0] || snap.incidents.slice().sort((a, b) => b.opened_at - a.opened_at)[0];
      if (!inc) { res.interp = 'There are no incidents on record.'; return res; }
      fact('Incident', `${inc.severity.toUpperCase()} · ${inc.source_label}`, null, inc.opened_at);
      fact('State', inc.state === 'cleared' ? 'cleared at ' + F.dt(inc.cleared_at) : 'ACTIVE' + (inc.acknowledged_at ? ' (acknowledged)' : ''), null, inc.last_seen_at);
      fact('Sensor snapshot', `${inc.snapshot.value} ${inc.snapshot.unit || ''} · threshold: ${inc.snapshot.threshold}`, null, inc.opened_at);
      const fw = inc.actions.filter((a) => a.actor === 'firmware');
      if (fw.length) fact('Reported responses', fw.map((a) => a.action).join('; '), null, fw[0].at);
      res.interp = (act.length ? 'ORION raised this because ' : 'The most recent incident was raised because ') +
        { smoke: 'the MQ-2 raw reading crossed the configured threshold.', flame: 'the flame sensor reported a detection.', water: 'the water sensor reported wet.', sensor_stale: 'a sensor stopped reporting.', sensor_fault: 'a sensor reported a fault.', controller: 'a controller heartbeat went missing.', gsm: 'the GSM module lost network registration.' }[inc.type];
      res.caveats.push('Responses listed are what the controller reported doing. They are not proof of physical outcomes (no feedback sensors).');
      if (inc.type === 'smoke') res.caveats.push('MQ-2 values are raw ADC, not ppm, and the module is uncalibrated.');
      res.links.push({ href: '#alerts', label: 'Open Alerts & incidents' });
      return res;
    }
    if (/water|leak|wet/.test(t)) {
      const w = sensorOf('water'); if (!w) return missing('water sensor');
      const wet = w.state === 'warning' || w.state === 'critical' || w.fields.wet === true;
      fact('Water sensor now', w.quality !== 'valid' ? `no valid reading (${w.quality})` : `${wet ? 'WET' : 'dry'} · raw ${w.fields.raw_adc}`, w.id, w.recorded_at);
      const last = snap.incidents.filter((i) => i.type === 'water').sort((a, b) => b.opened_at - a.opened_at)[0];
      if (last) fact('Latest water event', `${last.state === 'cleared' ? 'cleared' : 'ACTIVE'} · opened ${F.dt(last.opened_at)} · raw ${last.snapshot.value}`, null, last.opened_at);
      res.interp = last ? 'That is the most recent water incident in ORION’s history.' : 'No water incidents are on record.';
      res.caveats.push('ORION cannot estimate leak volume or severity: the sensor is uncalibrated and placement is unvalidated.');
      return res;
    }
    if (/smoke|gas|mq|air/.test(t)) {
      const m = sensorOf('mq2'); if (!m) return missing('smoke/gas sensor');
      fact('MQ-2 (raw ADC)', m.quality === 'warming_up' ? `warming up (${m.warmup_remaining_s} s left)` : String(m.fields.raw_adc), m.id, m.recorded_at);
      if (m.fw_threshold) fact('Firmware thresholds', `warning ${m.fw_threshold.warning} · critical ${m.fw_threshold.critical} (placeholder)`, null, null);
      fact('Device-reported state', m.state, null, m.recorded_at);
      res.interp = 'The MQ-2 reports a raw ADC count. It indicates relative change, not a gas concentration.';
      res.caveats.push('Raw ADC is not ppm. MQ-2 is not a certified smoke or gas detector.');
      return res;
    }
    if (/flame|fire/.test(t)) {
      const f = sensorOf('flame'); if (!f) return missing('flame sensor');
      const fl = f.state === 'critical' || f.fields.detected === true;
      fact('Flame sensor', f.quality !== 'valid' ? `no valid reading (${f.quality})` : fl ? 'DETECTED' : 'not detected', f.id, f.recorded_at);
      res.interp = 'Digital flame module reading. Its polarity has not been verified on the real hardware.';
      return res;
    }
    if (/esp32|uno|controller|online|board|gateway/.test(t)) {
      for (const [k, c] of Object.entries(snap.controllers)) {
        const o = ev.controllers[k];
        res.facts.push({ label: c.name, value: (o.online ? 'online' : 'NO HEARTBEAT') + ' · last seen ' + F.ago(c.last_seen_at, now) + ' · fw ' + c.firmware_version, at: c.last_seen_at, status: o.online ? 'fresh' : 'STALE' });
      }
      res.interp = 'Online means a heartbeat arrived within the configured interval. In ORION the UNO reads the sensors and drives the outputs; the ESP32 is the gateway to the server and the GSM module.';
      return res;
    }
    if (/gsm|sms|call|sim|modem|text/.test(t)) {
      const g = snap.gsm;
      if (!g) return missing('GSM module');
      res.facts.push({ label: 'SIM800C', value: ev.gsm.reported ? (g.network_registered ? `registered · CSQ ${g.csq}` : 'NOT registered') : 'no status report', at: g.last_report_at, status: ev.gsm.reported ? 'fresh' : 'STALE' });
      const a = (snap.gsmAttempts || [])[0];
      if (a) fact('Last attempt', `${a.type.toUpperCase()} · ${a.status} · ${a.note}`, null, a.updated_at);
      res.interp = 'A controller being online does not mean GSM works. SMS and calls are reported separately, and “sent” means the modem accepted it, not that it was delivered.';
