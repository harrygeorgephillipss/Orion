# ORION server stack: PostgreSQL + Mosquitto + backend (+ optional Caddy for HTTPS).
#   python3 scripts/setup.py          # writes .env with strong random secrets (never commit .env)
#   docker compose -f deployment/docker-compose.yml --env-file .env up -d --build
name: orion
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    # not published on the host: only the backend reaches it

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/orion-entrypoint.sh:ro
      - mqttauth:/run/orion-auth            # broker accounts, maintained by the backend
      - mqttdata:/mosquitto/data
      - caddydata:/caddy-data:ro            # Caddy's certificate, reused for TLS on 8883 (cloud setup)
    entrypoint: ["sh", "/orion-entrypoint.sh"]
    environment:
      ORION_DOMAIN: ${ORION_DOMAIN:-}
    ports:
      - "${ORION_MQTT_PLAIN_BIND:-1883}:1883"           # plain: home network only (cloud: 127.0.0.1:1883)
      - "${ORION_MQTT_TLS_BIND:-127.0.0.1:8883}:8883"   # TLS: gateways over the internet (cloud: 8883)

  backend:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    env_file: ../.env
    environment:
      ORION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ORION_MQTT_HOST: mqtt
      ORION_MQTT_PASSWD_FILE: /run/orion-auth/passwd
    volumes: [mqttauth:/run/orion-auth]
    ports: ["127.0.0.1:8000:8000"]   # publish via Caddy below, or change to 8000:8000 on a trusted LAN

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["https"]   # enable with: --profile https
    environment:
      ORION_DOMAIN: ${ORION_DOMAIN:-}
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [backend]

volumes: { pgdata: {}, mqttdata: {}, mqttauth: {}, caddydata: {} }
